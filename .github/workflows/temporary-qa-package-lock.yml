name: Temporary QA package lock generator

on:
  push:
    branches:
      - feat/permanent-staging-certification
    paths:
      - qa/staging-certification/package.json

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/permanent-staging-certification

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Generate lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd qa/staging-certification
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- qa/staging-certification/package-lock.json; then
            echo "QA package lock is already current."
            exit 0
          fi
          git config user.name "skillup-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa/staging-certification/package-lock.json
          git commit -m "chore(qa): lock Playwright runner dependencies"
          git push origin HEAD:feat/permanent-staging-certification
