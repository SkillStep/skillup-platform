name: Export internal go-live source

on:
  push:
    branches:
      - tools/internal-go-live-source-export
    paths:
      - .github/workflows/export-internal-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/internal-go-live-authorities
          persist-credentials: false
          fetch-depth: 1

      - name: Build source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.next' \
            -czf /tmp/skillup-internal-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skillup-internal-source-${{ github.run_id }}
          path: /tmp/skillup-internal-source.tar.gz
          if-no-files-found: error
          retention-days: 1
