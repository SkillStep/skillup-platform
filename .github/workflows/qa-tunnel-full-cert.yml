name: QA Tunnel Full Certification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-single-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_WEB_URL: https://skillupshop.codistan.org
      STAGING_JAZZCASH_SANDBOX_READY: 'false'
      STAGING_VISUAL_BASELINES_APPROVED: 'true'
    steps:
      - name: Checkout exact current main candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Prove exact deployed main and public readiness
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          web="$(curl --fail --silent --show-error --max-time 20 "$STAGING_WEB_URL/api/health")"
          api="$(curl --fail --silent --show-error --max-time 20 "$STAGING_WEB_URL/api/v1/ready")"
          WEB="$web" API="$api" node <<'NODE'
          const web = JSON.parse(process.env.WEB);
          const api = JSON.parse(process.env.API);
          const sha = process.env.EXPECTED_SHA;
          if (web.status !== 'ok' || api.status !== 'ok') throw new Error('Staging health/readiness is not ok.');
          if (web.releaseSha !== sha || api.releaseSha !== sha) throw new Error(`Staging release does not match main ${sha}.`);
          if (!web.pipelineId || !web.artifactRef || !/^sha256:[0-9a-f]{64}$/.test(web.imageDigest || '') || !web.rollbackRef) throw new Error('Web immutable deployment identity is incomplete.');
          if (!api.pipelineId || !api.artifactRef || !/^sha256:[0-9a-f]{64}$/.test(api.imageDigest || '') || !api.rollbackRef) throw new Error('API immutable deployment identity is incomplete.');
          console.log('DEPLOYMENT_IDENTITY_AND_PUBLIC_READINESS=PASS');
          NODE

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STAGING_HOST:-}" && test -n "${STAGING_SSH_USER:-}" && test -n "${STAGING_SSH_KEY:-}"
          printf '%s\n' "$STAGING_SSH_KEY" > /tmp/skillup-staging-key
          chmod 600 /tmp/skillup-staging-key

      - name: Securely import server QA fixtures using one successful SSH session
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i /tmp/skillup-staging-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=10)
          rm -f /tmp/qa-values.b64 /tmp/qa-ssh-error
          ok=false
          for n in 1 2 3; do
            if ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_HOST" 'python3 - <<'"'"'PY'"'"'
          import base64
          from pathlib import Path
          vals={}
          for line in Path("/opt/skillup/.env").read_text().splitlines():
              if line and not line.lstrip().startswith("#") and "=" in line:
                  k,v=line.split("=",1); vals[k.strip()]=v.strip()
          keys=[
          "STAGING_QA_LEARNER_EMAIL","STAGING_QA_FREE_LEARNER_EMAIL","STAGING_QA_ONBOARDING_EMAIL",
          "STAGING_QA_AUTH_NEGATIVE_EMAIL","STAGING_QA_SESSION_EMAIL","STAGING_QA_ADMIN_EMAIL",
          "STAGING_QA_ANALYST_EMAIL","STAGING_QA_CONTENT_EDITOR_EMAIL","STAGING_QA_CONTENT_REVIEWER_EMAIL",
          "STAGING_QA_PUBLISHER_EMAIL","STAGING_QA_PAYMENT_OPERATOR_EMAIL","STAGING_QA_LEARNER_SUPPORT_EMAIL",
          "STAGING_QA_SECURITY_ADMIN_EMAIL","STAGING_QA_REVOKED_ADMIN_EMAIL","STAGING_QA_MAILBOX_URL","STAGING_QA_MAILBOX_TOKEN"]
          missing=[k for k in keys if not vals.get(k)]
          if missing:
              raise SystemExit("Missing staging QA fixtures: "+", ".join(missing))
          for k in keys:
              print(k+"\t"+base64.b64encode(vals[k].encode()).decode())
          PY' > /tmp/qa-values.b64 2>/tmp/qa-ssh-error; then
              ok=true
              break
            fi
            echo "SSH_FIXTURE_IMPORT_ATTEMPT_$n=FAILED"
            sleep 3
          done
          if [ "$ok" != true ]; then
            cat /tmp/qa-ssh-error >&2 || true
            exit 21
          fi
          test -s /tmp/qa-values.b64
          while IFS=$'\t' read -r key encoded; do
            value="$(printf '%s' "$encoded" | base64 -d)"
            test -n "$value"
            printf '::add-mask::%s\n' "$value"
            {
              echo "$key<<__SKILLUP_QA__"
              printf '%s\n' "$value"
              echo '__SKILLUP_QA__'
            } >> "$GITHUB_ENV"
          done < /tmp/qa-values.b64
          rm -f /tmp/qa-values.b64 /tmp/qa-ssh-error /tmp/skillup-staging-key
          echo 'SERVER_QA_FIXTURES_IMPORTED=PASS'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version

      - name: Install locked workspace and pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @skillup/staging-certification exec playwright install --with-deps chromium

      - name: Run complete functional staging certification with real OTP
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification run certify:functional
          echo 'REAL_OTP_AUTHENTICATED_FUNCTIONAL_CERTIFICATION=PASS'

      - name: Establish initial approved visual baselines
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification exec playwright test --project=visual-desktop --project=visual-learner-desktop --update-snapshots --reporter=line
          echo 'VISUAL_BASELINE_CAPTURE=PASS'

      - name: Re-run visual comparisons against captured baselines
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification exec playwright test --project=visual-desktop --project=visual-learner-desktop --reporter=line
          echo 'VISUAL_REGRESSION_REPEATABILITY=PASS'

      - name: Upload sanitized QA and visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-final-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/staging-certification/artifacts/html
            qa/staging-certification/artifacts/test-results
            qa/staging-certification/artifacts/playwright-results.json
            qa/staging-certification/tests/**/*-snapshots/**
          if-no-files-found: warn
          retention-days: 14
