name: Patch attempt rubric evidence

on:
  push:
    branches:
      - feat/internal-go-live-authorities
    paths:
      - .github/workflows/patch-attempt-rubric-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/internal-go-live-authorities
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch API attempt persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/gameplay.ts")
          source = path.read_text()
          source = source.replace(
              '''  explanation: string;\n  retry_allowed: boolean;\n  attempt_number: number;''',
              '''  explanation: string;\n  retry_allowed: boolean;\n  confidence: string | null;\n  matched_criteria: unknown;\n  review_reason: string | null;\n  attempt_number: number;''',
              1,
          )
          source = source.replace(
              '''select id, status, awarded_points, max_points, explanation, retry_allowed,\n                  attempt_number, submitted_at''',
              '''select id, status, awarded_points, max_points, explanation, retry_allowed,\n                  confidence, matched_criteria, review_reason, attempt_number, submitted_at''',
              1,
          )
          source = source.replace(
              '''            retryAllowed: existing.retry_allowed,\n            attemptNumber: existing.attempt_number,\n            evaluatedAt: existing.submitted_at.toISOString(),''',
              '''            retryAllowed: existing.retry_allowed,\n            attemptNumber: existing.attempt_number,\n            evaluatedAt: existing.submitted_at.toISOString(),\n            confidence: existing.confidence === null ? undefined : Number(existing.confidence),\n            matchedCriteria: Array.isArray(existing.matched_criteria)\n              ? existing.matched_criteria.filter(\n                  (item): item is string => typeof item === "string",\n                )\n              : undefined,\n            reviewReason: existing.review_reason,''',
              1,
          )
          source = source.replace(
              '''             response_hash, response, status, awarded_points, max_points, explanation,\n             retry_allowed, submitted_at\n           )\n           values ($1, $2, $3, $4, $5, $6, $7::jsonb, $8, $9, $10, $11, $12)\n           returning id, status, awarded_points, max_points, explanation, retry_allowed,\n                     attempt_number, submitted_at''',
              '''             response_hash, response, status, confidence, matched_criteria, review_reason,\n             awarded_points, max_points, explanation, retry_allowed, submitted_at\n           )\n           values ($1, $2, $3, $4, $5, $6, $7::jsonb, $8, $9, $10::jsonb, $11, $12, $13, $14, $15)\n           returning id, status, awarded_points, max_points, explanation, retry_allowed,\n                     confidence, matched_criteria, review_reason, attempt_number, submitted_at''',
              1,
          )
          source = source.replace(
              '''            evaluation.status,\n            evaluation.awardedPoints,\n            evaluation.maxPoints,\n            evaluation.explanation,\n            evaluation.retryAllowed,\n            evaluatedAt,''',
              '''            evaluation.status,\n            evaluation.confidence ?? null,\n            JSON.stringify(evaluation.matchedCriteria ?? []),\n            evaluation.reviewReason ?? null,\n            evaluation.awardedPoints,\n            evaluation.maxPoints,\n            evaluation.explanation,\n            evaluation.retryAllowed,\n            evaluatedAt,''',
              1,
          )
          source = source.replace(
              '''          retryAllowed: attempt.retry_allowed,\n          attemptNumber: attempt.attempt_number,\n          evaluatedAt: attempt.submitted_at.toISOString(),''',
              '''          retryAllowed: attempt.retry_allowed,\n          attemptNumber: attempt.attempt_number,\n          evaluatedAt: attempt.submitted_at.toISOString(),\n          confidence: attempt.confidence === null ? undefined : Number(attempt.confidence),\n          matchedCriteria: Array.isArray(attempt.matched_criteria)\n            ? attempt.matched_criteria.filter(\n                (item): item is string => typeof item === "string",\n              )\n            : undefined,\n          reviewReason: attempt.review_reason,''',
              1,
          )
          path.write_text(source)
          PY
          pnpm exec biome format --write apps/api/src/gameplay.ts
          git rm .github/workflows/patch-attempt-rubric-evidence.yml

      - name: Commit and push patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "waseem99"
          git config user.email "mwaseemkha@gmail.com"
          git add --all
          git commit -m "feat: preserve rubric evidence across retries"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:feat/internal-go-live-authorities
