name: QA Final Staging UAT

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-final-staging-uat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_EMAIL_PROVIDER_READY: ${{ vars.STAGING_EMAIL_PROVIDER_READY }}
      STAGING_DEEPSEEK_READY: ${{ vars.STAGING_DEEPSEEK_READY }}
      STAGING_JAZZCASH_SANDBOX_READY: ${{ vars.STAGING_JAZZCASH_SANDBOX_READY }}
      STAGING_VISUAL_BASELINES_APPROVED: ${{ vars.STAGING_VISUAL_BASELINES_APPROVED }}
      STAGING_QA_LEARNER_PREMIUM_READY: ${{ vars.STAGING_QA_LEARNER_PREMIUM_READY }}
      STAGING_QA_LEARNER_EMAIL: ${{ vars.STAGING_QA_LEARNER_EMAIL }}
      STAGING_QA_FREE_LEARNER_EMAIL: ${{ vars.STAGING_QA_FREE_LEARNER_EMAIL }}
      STAGING_QA_ONBOARDING_EMAIL: ${{ vars.STAGING_QA_ONBOARDING_EMAIL }}
      STAGING_QA_AUTH_NEGATIVE_EMAIL: ${{ vars.STAGING_QA_AUTH_NEGATIVE_EMAIL }}
      STAGING_QA_SESSION_EMAIL: ${{ vars.STAGING_QA_SESSION_EMAIL }}
      STAGING_QA_ADMIN_EMAIL: ${{ vars.STAGING_QA_ADMIN_EMAIL }}
      STAGING_QA_ANALYST_EMAIL: ${{ vars.STAGING_QA_ANALYST_EMAIL }}
      STAGING_QA_CONTENT_EDITOR_EMAIL: ${{ vars.STAGING_QA_CONTENT_EDITOR_EMAIL }}
      STAGING_QA_CONTENT_REVIEWER_EMAIL: ${{ vars.STAGING_QA_CONTENT_REVIEWER_EMAIL }}
      STAGING_QA_PUBLISHER_EMAIL: ${{ vars.STAGING_QA_PUBLISHER_EMAIL }}
      STAGING_QA_PAYMENT_OPERATOR_EMAIL: ${{ vars.STAGING_QA_PAYMENT_OPERATOR_EMAIL }}
      STAGING_QA_LEARNER_SUPPORT_EMAIL: ${{ vars.STAGING_QA_LEARNER_SUPPORT_EMAIL }}
      STAGING_QA_SECURITY_ADMIN_EMAIL: ${{ vars.STAGING_QA_SECURITY_ADMIN_EMAIL }}
      STAGING_QA_REVOKED_ADMIN_EMAIL: ${{ vars.STAGING_QA_REVOKED_ADMIN_EMAIL }}
      STAGING_QA_MAILBOX_URL: ${{ vars.STAGING_QA_MAILBOX_URL }}
      STAGING_QA_MAILBOX_TOKEN: ${{ secrets.STAGING_QA_MAILBOX_TOKEN }}
    steps:
      - name: Confirm exact deployed main release
        id: release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE="${STAGING_WEB_URL:-https://skillupshop.codistan.org}"
          body="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/health")"
          BODY="$body" node <<'NODE'
          const body = JSON.parse(process.env.BODY);
          if (body.status !== 'ok') throw new Error('Web health is not ok');
          if (body.releaseSha !== process.env.EXPECTED_SHA) throw new Error(`Live release ${body.releaseSha} does not match main ${process.env.EXPECTED_SHA}`);
          if (!body.pipelineId || !body.artifactRef || !/^sha256:[0-9a-f]{64}$/.test(body.imageDigest || '') || !body.rollbackRef) throw new Error('Immutable deployment identity is incomplete');
          console.log('EXACT_DEPLOYED_MAIN=PASS');
          NODE

      - name: Check protected OTP and role fixture configuration first
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          required=(
            STAGING_QA_LEARNER_EMAIL STAGING_QA_FREE_LEARNER_EMAIL STAGING_QA_ONBOARDING_EMAIL
            STAGING_QA_AUTH_NEGATIVE_EMAIL STAGING_QA_SESSION_EMAIL STAGING_QA_ADMIN_EMAIL
            STAGING_QA_ANALYST_EMAIL STAGING_QA_CONTENT_EDITOR_EMAIL STAGING_QA_CONTENT_REVIEWER_EMAIL
            STAGING_QA_PUBLISHER_EMAIL STAGING_QA_PAYMENT_OPERATOR_EMAIL STAGING_QA_LEARNER_SUPPORT_EMAIL
            STAGING_QA_SECURITY_ADMIN_EMAIL STAGING_QA_REVOKED_ADMIN_EMAIL STAGING_QA_MAILBOX_URL
            STAGING_QA_MAILBOX_TOKEN
          )
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING=$name"
              missing=$((missing+1))
            fi
          done
          echo "OTP_FIXTURE_MISSING_COUNT=$missing"
          echo "EMAIL_PROVIDER_READY=${STAGING_EMAIL_PROVIDER_READY:-unset}"
          echo "PREMIUM_FIXTURE_READY=${STAGING_QA_LEARNER_PREMIUM_READY:-unset}"
          echo "DEEPSEEK_READY=${STAGING_DEEPSEEK_READY:-unset}"
          echo "JAZZCASH_READY=${STAGING_JAZZCASH_SANDBOX_READY:-unset}"
          echo "VISUAL_BASELINES_APPROVED=${STAGING_VISUAL_BASELINES_APPROVED:-unset}"
          if [ "$missing" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'AUTOMATED_REAL_OTP_FIXTURE=READY'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'AUTOMATED_REAL_OTP_FIXTURE=BLOCKED'
          fi

      - name: Public edge diagnostics with normal and browser user agents
        shell: bash
        run: |
          set -euo pipefail
          BASE="${STAGING_WEB_URL:-https://skillupshop.codistan.org}"
          routes=(/api/health /api/v1/health /api/v1/ready /en /en/skills /en/pricing /en/sign-in /en/paths/interview-workplace-communication /en/paths/practical-english-study-work /en/paths/ai-tools-study-work /en/paths/freelancing-foundations /en/paths/digital-marketing-foundations)
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          for route in "${routes[@]}"; do
            for mode in default browser; do
              args=(--silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code} %{time_total}')
              if [ "$mode" = browser ]; then args+=(--user-agent "$browser_ua"); fi
              result="$(curl "${args[@]}" "$BASE$route")"
              code="${result%% *}"
              echo "$mode $route $result"
              case "$code" in 2*|3*|404) ;; *) echo "::error::$mode $route returned $code"; exit 1;; esac
            done
          done
          echo 'PUBLIC_EDGE_CURL=PASS'

      - name: Checkout QA harness from exact main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version

      - name: Install locked workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          google-chrome --version

      - name: Robust Chromium public runtime and performance proof
        shell: bash
        working-directory: qa/staging-certification
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base = process.env.STAGING_WEB_URL || 'https://skillupshop.codistan.org';
          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const context = await browser.newContext({ extraHTTPHeaders: { origin: new URL(base).origin } });
          const page = await context.newPage();
          const pageErrors = [];
          const failed = [];
          const pending = new Map();
          page.on('pageerror', e => pageErrors.push(e.message));
          page.on('request', r => pending.set(r, r.url()));
          page.on('requestfinished', r => pending.delete(r));
          page.on('requestfailed', r => { pending.delete(r); failed.push(`${r.url()} :: ${r.failure()?.errorText || 'failed'}`); });
          const routes = [
            ['/en', 'SkillUp'],
            ['/en/skills', 'Interview and Workplace Communication'],
            ['/en/pricing', 'Rs 599'],
            ['/en/sign-in', 'Pick up where you left off.'],
            ['/en/paths/interview-workplace-communication', 'Interview and Workplace Communication'],
            ['/en/paths/practical-english-study-work', 'Practical English for Study and Work'],
            ['/en/paths/ai-tools-study-work', 'AI Tools for Study and Work'],
            ['/en/paths/freelancing-foundations', 'Freelancing Foundations'],
            ['/en/paths/digital-marketing-foundations', 'Digital Marketing Foundations'],
          ];
          for (const [route, expected] of routes) {
            let response = null;
            let lastError = null;
            for (let attempt = 1; attempt <= 3 && !response; attempt++) {
              try {
                response = await page.goto(base + route, { waitUntil: 'domcontentloaded', timeout: 30000 });
              } catch (error) {
                lastError = error;
                await page.waitForTimeout(1000);
              }
            }
            if (!response) throw new Error(`${route}: no document response after retries: ${lastError?.message || 'unknown'}`);
            if (!response.ok()) throw new Error(`${route}: HTTP ${response.status()}`);
            await page.waitForTimeout(3000);
            const body = await page.locator('body').innerText();
            if (!body.includes(expected)) throw new Error(`${route}: expected visible content not found: ${expected}`);
            const timing = await page.evaluate(() => {
              const n = performance.getEntriesByType('navigation')[0];
              return n ? { dcl: Math.round(n.domContentLoadedEventEnd), load: Math.round(n.loadEventEnd) } : null;
            });
            const sameOriginPending = [...pending.values()].filter(u => u.startsWith(new URL(base).origin));
            console.log(`${route}=PASS status=${response.status()} timing=${JSON.stringify(timing)} same_origin_pending=${sameOriginPending.length}`);
            if (sameOriginPending.length) console.log(`PENDING ${sameOriginPending.slice(0,8).join(' | ')}`);
          }
          if (pageErrors.length) throw new Error(`Uncaught page errors: ${pageErrors.join(' | ')}`);
          if (failed.length) console.log(`NON_FATAL_REQUEST_FAILURES=${failed.slice(0,10).join(' | ')}`);
          await browser.close();
          console.log('ROBUST_CHROMIUM_PUBLIC=PASS');
          NODE

      - name: Run real OTP authentication setup
        if: steps.fixtures.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const p='qa/staging-certification/playwright.config.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('baseURL,\n    extraHTTPHeaders', 'baseURL,\n    channel: "chrome",\n    extraHTTPHeaders');
          fs.writeFileSync(p,s);
          NODE
          pnpm --filter @skillup/staging-certification exec playwright test --project=auth-setup --reporter=line
          echo 'REAL_OTP_AUTH_SETUP=PASS'

      - name: Run full authenticated functional Playwright certification
        if: steps.fixtures.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification run certify:functional
          echo 'AUTHENTICATED_FUNCTIONAL_CERTIFICATION=PASS'

      - name: Fail if protected OTP fixture is still absent
        if: steps.fixtures.outputs.ready != 'true'
        shell: bash
        run: |
          echo '::error::Protected QA mailbox/identity fixture is still not fully configured in the staging environment.'
          exit 20

      - name: Upload functional QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-final-staging-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/staging-certification/artifacts/html
            qa/staging-certification/artifacts/test-results
            qa/staging-certification/artifacts/playwright-results.json
          if-no-files-found: warn
          retention-days: 14

  visual-baseline:
    needs: certify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_VISUAL_BASELINES_APPROVED: 'true'
      STAGING_QA_LEARNER_EMAIL: ${{ vars.STAGING_QA_LEARNER_EMAIL }}
      STAGING_QA_FREE_LEARNER_EMAIL: ${{ vars.STAGING_QA_FREE_LEARNER_EMAIL }}
      STAGING_QA_ONBOARDING_EMAIL: ${{ vars.STAGING_QA_ONBOARDING_EMAIL }}
      STAGING_QA_ADMIN_EMAIL: ${{ vars.STAGING_QA_ADMIN_EMAIL }}
      STAGING_QA_ANALYST_EMAIL: ${{ vars.STAGING_QA_ANALYST_EMAIL }}
      STAGING_QA_CONTENT_EDITOR_EMAIL: ${{ vars.STAGING_QA_CONTENT_EDITOR_EMAIL }}
      STAGING_QA_CONTENT_REVIEWER_EMAIL: ${{ vars.STAGING_QA_CONTENT_REVIEWER_EMAIL }}
      STAGING_QA_PUBLISHER_EMAIL: ${{ vars.STAGING_QA_PUBLISHER_EMAIL }}
      STAGING_QA_PAYMENT_OPERATOR_EMAIL: ${{ vars.STAGING_QA_PAYMENT_OPERATOR_EMAIL }}
      STAGING_QA_LEARNER_SUPPORT_EMAIL: ${{ vars.STAGING_QA_LEARNER_SUPPORT_EMAIL }}
      STAGING_QA_SECURITY_ADMIN_EMAIL: ${{ vars.STAGING_QA_SECURITY_ADMIN_EMAIL }}
      STAGING_QA_REVOKED_ADMIN_EMAIL: ${{ vars.STAGING_QA_REVOKED_ADMIN_EMAIL }}
      STAGING_QA_MAILBOX_URL: ${{ vars.STAGING_QA_MAILBOX_URL }}
      STAGING_QA_MAILBOX_TOKEN: ${{ secrets.STAGING_QA_MAILBOX_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Install locked workspace and use runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          node <<'NODE'
          const fs=require('fs'); const p='qa/staging-certification/playwright.config.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('baseURL,\n    extraHTTPHeaders', 'baseURL,\n    channel: "chrome",\n    extraHTTPHeaders');
          fs.writeFileSync(p,s);
          NODE
      - name: Create fresh authenticated browser states
        run: pnpm --filter @skillup/staging-certification exec playwright test --project=auth-setup --reporter=line
      - name: Capture candidate visual baselines
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification exec playwright test --project=visual-desktop --project=visual-learner-desktop --update-snapshots --reporter=line
          echo 'VISUAL_BASELINE_CAPTURE=PASS'
      - name: Upload candidate visual baselines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-final-staging-visuals-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/staging-certification/tests/**/*-snapshots/**
            qa/staging-certification/artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
