name: Diagnose Final Main Deploy

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Actions runs for final main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: 59604af3a9f1e6e76b35251113130969ce52e9c5
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > /tmp/runs.json
          RUNS_JSON="$(cat /tmp/runs.json)" node <<'NODE'
          const body = JSON.parse(process.env.RUNS_JSON);
          const runs = body.workflow_runs || [];
          if (!runs.length) throw new Error('No workflow runs found for final main SHA');
          for (const run of runs) {
            console.log(`RUN id=${run.id} name=${JSON.stringify(run.name)} event=${run.event} status=${run.status} conclusion=${run.conclusion || 'null'} attempt=${run.run_attempt}`);
          }
          const deploy = runs.find((run) => run.name === 'Staging Deploy');
          if (!deploy) throw new Error('Staging Deploy run not found for final main SHA');
          console.log(`STAGING_DEPLOY_RUN_ID=${deploy.id}`);
          console.log(`STAGING_DEPLOY_STATUS=${deploy.status}`);
          console.log(`STAGING_DEPLOY_CONCLUSION=${deploy.conclusion || 'null'}`);
          require('fs').writeFileSync('/tmp/deploy-id', String(deploy.id));
          NODE
          deploy_id="$(cat /tmp/deploy-id)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/runs/$deploy_id/jobs?per_page=100" > /tmp/jobs.json
          JOBS_JSON="$(cat /tmp/jobs.json)" node <<'NODE'
          const body = JSON.parse(process.env.JOBS_JSON);
          for (const job of body.jobs || []) {
            console.log(`JOB id=${job.id} name=${JSON.stringify(job.name)} status=${job.status} conclusion=${job.conclusion || 'null'}`);
            for (const step of job.steps || []) {
              console.log(`  STEP ${step.number} ${JSON.stringify(step.name)} status=${step.status} conclusion=${step.conclusion || 'null'}`);
            }
          }
          NODE
