name: QA Secret Name Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      S1: ${{ secrets.STAGING_QA_MAILBOX_URL }}
      S2: ${{ secrets.STAGING_QA_MAILBOX_TOKEN }}
      S3: ${{ secrets.QA_MAILBOX_URL }}
      S4: ${{ secrets.QA_MAILBOX_TOKEN }}
      S5: ${{ secrets.STAGING_MAILBOX_URL }}
      S6: ${{ secrets.STAGING_MAILBOX_TOKEN }}
      S7: ${{ secrets.MAILBOX_URL }}
      S8: ${{ secrets.MAILBOX_TOKEN }}
      S9: ${{ secrets.QA_EMAIL }}
      S10: ${{ secrets.STAGING_QA_EMAIL }}
      S11: ${{ secrets.STAGING_TEST_EMAIL }}
      S12: ${{ secrets.TEST_EMAIL }}
      S13: ${{ secrets.QA_LEARNER_EMAIL }}
      S14: ${{ secrets.STAGING_QA_LEARNER_EMAIL }}
      S15: ${{ secrets.QA_MAILBOX_EMAIL }}
      S16: ${{ secrets.STAGING_QA_MAILBOX_EMAIL }}
      S17: ${{ secrets.GMAIL_USERNAME }}
      S18: ${{ secrets.GMAIL_APP_PASSWORD }}
      S19: ${{ secrets.QA_GMAIL_USERNAME }}
      S20: ${{ secrets.QA_GMAIL_APP_PASSWORD }}
      S21: ${{ secrets.BREVO_API_KEY }}
      S22: ${{ secrets.STAGING_BREVO_API_KEY }}
      V1: ${{ vars.QA_MAILBOX_URL }}
      V2: ${{ vars.STAGING_MAILBOX_URL }}
      V3: ${{ vars.MAILBOX_URL }}
      V4: ${{ vars.QA_EMAIL }}
      V5: ${{ vars.STAGING_QA_EMAIL }}
      V6: ${{ vars.STAGING_TEST_EMAIL }}
      V7: ${{ vars.TEST_EMAIL }}
      V8: ${{ vars.QA_LEARNER_EMAIL }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          names=(
            'secret:STAGING_QA_MAILBOX_URL' 'secret:STAGING_QA_MAILBOX_TOKEN'
            'secret:QA_MAILBOX_URL' 'secret:QA_MAILBOX_TOKEN'
            'secret:STAGING_MAILBOX_URL' 'secret:STAGING_MAILBOX_TOKEN'
            'secret:MAILBOX_URL' 'secret:MAILBOX_TOKEN'
            'secret:QA_EMAIL' 'secret:STAGING_QA_EMAIL' 'secret:STAGING_TEST_EMAIL' 'secret:TEST_EMAIL'
            'secret:QA_LEARNER_EMAIL' 'secret:STAGING_QA_LEARNER_EMAIL'
            'secret:QA_MAILBOX_EMAIL' 'secret:STAGING_QA_MAILBOX_EMAIL'
            'secret:GMAIL_USERNAME' 'secret:GMAIL_APP_PASSWORD' 'secret:QA_GMAIL_USERNAME' 'secret:QA_GMAIL_APP_PASSWORD'
            'secret:BREVO_API_KEY' 'secret:STAGING_BREVO_API_KEY'
            'var:QA_MAILBOX_URL' 'var:STAGING_MAILBOX_URL' 'var:MAILBOX_URL' 'var:QA_EMAIL'
            'var:STAGING_QA_EMAIL' 'var:STAGING_TEST_EMAIL' 'var:TEST_EMAIL' 'var:QA_LEARNER_EMAIL'
          )
          for i in $(seq 1 22); do
            key="S$i"; value="${!key:-}"
            if [ -n "$value" ]; then echo "PRESENT ${names[$((i-1))]}"; else echo "ABSENT ${names[$((i-1))]}"; fi
          done
          for i in $(seq 1 8); do
            key="V$i"; value="${!key:-}"; idx=$((21+i))
            if [ -n "$value" ]; then echo "PRESENT ${names[$idx]}"; else echo "ABSENT ${names[$idx]}"; fi
          done
