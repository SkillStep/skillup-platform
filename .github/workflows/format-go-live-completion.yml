name: Format go-live completion wave

on:
  push:
    branches:
      - feat/internal-go-live-authorities
    paths:
      - .github/workflows/format-go-live-completion.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/internal-go-live-authorities
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format completion files and remove helper
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome format --write \
            apps/api/src/admin-service-v2.ts \
            apps/api/src/admin.ts \
            apps/api/src/ai-job-status.ts \
            apps/api/src/ai-job-status.test.ts \
            apps/api/src/config.ts \
            apps/api/src/index.ts \
            apps/api/src/maintenance.ts \
            apps/api/src/maintenance.test.ts \
            apps/web/app/[locale]/account/account-controls.tsx \
            apps/web/app/[locale]/account/account.module.css \
            apps/web/app/[locale]/account/page.tsx \
            apps/web/app/[locale]/legal/[policy]/page.tsx \
            apps/web/app/[locale]/paths/[slug]/page.tsx \
            apps/web/app/[locale]/skills/[slug]/page.tsx \
            apps/web/app/[locale]/skills/page.tsx \
            apps/web/app/[locale]/skills/skill-search.tsx \
            apps/web/app/[locale]/support/page.tsx \
            apps/web/app/sitemap.ts \
            apps/web/lib/public-catalog.ts \
            apps/web/lib/public-catalog.test.ts \
            apps/web/lib/public-policies.ts \
            packages/database/drizzle/meta/_journal.json \
            packages/database/src/cli/complete-launch-smoke.ts \
            packages/database/src/complete-launch-challenges.ts \
            packages/database/src/complete-launch-seed-v2.ts \
            services/ai-worker/src/skillup_ai_worker/config.py \
            services/ai-worker/tests/test_config.py \
            services/ai-worker/src/skillup_ai_worker/api_queue.py \
            services/ai-worker/tests/test_api_queue.py \
            tools/validate-deployment.mjs \
            tools/validate-production-readiness.mjs \
            .env.example \
            infra/railway/ai-worker.railway.json
          git rm .github/workflows/format-go-live-completion.yml

      - name: Commit and push formatting
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "waseem99"
          git config user.email "mwaseemkha@gmail.com"
          git add --all
          git commit -m "style: format go-live completion wave"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:feat/internal-go-live-authorities
