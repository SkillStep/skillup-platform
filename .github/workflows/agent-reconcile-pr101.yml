name: Agent Reconcile PR101

on:
  push:
    branches:
      - feat/permanent-staging-certification

permissions:
  contents: write

concurrency:
  group: agent-reconcile-pr101
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/permanent-staging-certification
          fetch-depth: 0

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SkillUp CI"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Add controlled 503 handling and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app_path = Path("apps/api/src/app.ts")
          app = app_path.read_text()
          expected = '''  const statusCode =
            candidateStatusCode !== undefined && candidateStatusCode >= 400 && candidateStatusCode < 500
              ? candidateStatusCode
              : 500;

          return {
            statusCode,
            message: statusCode < 500 ? candidateMessage : "An unexpected server error occurred.",
          };
          '''
          replacement = '''  if (candidateStatusCode == 503) {
            return {
              statusCode: 503,
              message: "The requested service is temporarily unavailable.",
            };
          }

          const statusCode =
            candidateStatusCode !== undefined && candidateStatusCode >= 400 && candidateStatusCode < 500
              ? candidateStatusCode
              : 500;

          return {
            statusCode,
            message: statusCode < 500 ? candidateMessage : "An unexpected server error occurred.",
          };
          '''
          if expected not in app:
              raise SystemExit("normalizeError status block did not match expected merged source")
          app = app.replace(expected, replacement, 1)

          expected_code = '''        code: normalized.statusCode < 500 ? "request_error" : "internal_error",
          '''
          replacement_code = '''        code:
                  normalized.statusCode === 503
                    ? "service_unavailable"
                    : normalized.statusCode < 500
                      ? "request_error"
                      : "internal_error",
          '''
          if expected_code not in app:
              raise SystemExit("API error code mapping did not match expected merged source")
          app = app.replace(expected_code, replacement_code, 1)
          app_path.write_text(app)

          test_path = Path("apps/api/src/app.test.ts")
          tests = test_path.read_text()
          marker = '''  it("rejects state-changing requests from an untrusted origin", async () => {
          '''
          regression = '''  it("returns 503 when sign-in email delivery is unavailable", async () => {
            const baseAuthService = createAuthService();
            const authService: AuthService = {
              ...baseAuthService,
              startEmailSignIn: vi.fn(async () => {
                const error = new Error("Sign-in email delivery is temporarily unavailable.");
                Object.assign(error, { statusCode: 503 });
                throw error;
              }),
            };
            const response = await createTestApi(undefined, authService).inject({
              method: "POST",
              url: "/v1/auth/email/start",
              headers: { origin: "https://skillup.example" },
              payload: { email: "learner@example.com" },
            });

            expect(response.statusCode).toBe(503);
            expect(response.json()).toMatchObject({
              code: "service_unavailable",
              message: "The requested service is temporarily unavailable.",
            });
          });

          '''
          if regression not in tests:
              if marker not in tests:
                  raise SystemExit("auth-route regression insertion point not found")
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install and format repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm format
          pnpm format:check

      - name: Run focused API regression suite
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/api test
          pnpm --filter @skillup/api typecheck

      - name: Commit and push repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: reconcile staging certification branch"
          git push origin HEAD:feat/permanent-staging-certification
