name: Agent Patch Nanoid Advisory

on:
  push:
    branches:
      - feat/permanent-staging-certification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/permanent-staging-certification

      - name: Configure git
        run: |
          git config user.name "SkillUp CI"
          git config user.email "actions@users.noreply.github.com"

      - name: Patch nanoid override
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pnpm-workspace.yaml")
          text = path.read_text()
          old = '  "nanoid@3": 3.3.17\n'
          new = '  "nanoid@3": 3.3.18\n'
          if old not in text and new not in text:
              raise SystemExit("Expected nanoid override was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Refresh lockfile and verify advisory gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
          pnpm format:check

      - name: Commit repaired dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "fix: patch nanoid production advisory"
          git push origin HEAD:feat/permanent-staging-certification
