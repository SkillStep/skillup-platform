name: Patch short-response rubric

on:
  push:
    branches:
      - feat/internal-go-live-authorities
    paths:
      - .github/workflows/patch-short-response-rubric.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/internal-go-live-authorities
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch gameplay engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/gameplay-engine/src/index.ts")
          source = path.read_text()
          source = source.replace(
              'import { z } from "zod";\n',
              'import { z } from "zod";\n\nimport { ShortResponseEvaluationSchema, evaluateShortResponseRubric } from "./short-response-rubric.js";\n',
              1,
          )
          source = source.replace(
              '''  evaluatedAt: z.iso.datetime(),\n});''',
              '''  evaluatedAt: z.iso.datetime(),\n  confidence: z.number().min(0).max(1).optional(),\n  matchedCriteria: z.array(z.string().min(1).max(120)).max(12).optional(),\n  reviewReason: z.string().min(1).max(120).nullable().optional(),\n});''',
              1,
          )
          source = source.replace(
              '''const ShortResponseEvaluationSchema = z.object({\n  policy: z.literal("manual_review_only"),\n  uncertaintyMessage: z.string().min(20).max(300),\n});\n\n''',
              '',
              1,
          )
          old = '''    case "short_response": {\n      const evaluation = ShortResponseEvaluationSchema.parse(input.privateEvaluation);\n      ShortResponseSchema.parse(response);\n      status = "needs_review";\n      return ChallengeEvaluationResultSchema.parse({\n        challengeId: challenge.id,\n        challengeVersionId: challenge.versionId,\n        status,\n        awardedPoints: 0,\n        maxPoints: challenge.points,\n        explanation: evaluation.uncertaintyMessage,\n        retryAllowed: false,\n        attemptNumber,\n        evaluatedAt,\n      });\n    }'''
          new = '''    case "short_response": {\n      const evaluation = ShortResponseEvaluationSchema.parse(input.privateEvaluation);\n      const typedResponse = ShortResponseSchema.parse(response);\n      const rubric = evaluateShortResponseRubric(evaluation, typedResponse.value);\n      return ChallengeEvaluationResultSchema.parse({\n        challengeId: challenge.id,\n        challengeVersionId: challenge.versionId,\n        status: rubric.status,\n        awardedPoints: rubric.status === "correct" ? challenge.points : 0,\n        maxPoints: challenge.points,\n        explanation: rubric.explanation,\n        retryAllowed:\n          rubric.status === "incorrect" && attemptNumber < maxAttempts,\n        attemptNumber,\n        evaluatedAt,\n        confidence: rubric.confidence,\n        matchedCriteria: rubric.matchedCriteria,\n        reviewReason: rubric.reviewReason,\n      });\n    }'''
          if old not in source:
              raise SystemExit("Short-response evaluation block was not found.")
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          pnpm exec biome format --write \
            packages/gameplay-engine/src/index.ts \
            packages/gameplay-engine/src/short-response-rubric.ts
          git rm .github/workflows/patch-short-response-rubric.yml

      - name: Commit and push patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "waseem99"
          git config user.email "mwaseemkha@gmail.com"
          git add --all
          git commit -m "feat: connect bounded short-response scoring"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:feat/internal-go-live-authorities
