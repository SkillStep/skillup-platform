name: Fix playable level quality

on:
  push:
    branches:
      - feat/23-playable-level-web

permissions:
  contents: write

concurrency:
  group: fix-playable-level-quality
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/23-playable-level-web
          persist-credentials: true
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          player_path = Path("apps/web/app/[locale]/learn/[levelId]/level-player.tsx")
          player = player_path.read_text(encoding="utf-8")

          player = player.replace(
              '''  const challengeKey = challenge
              ? `${challenge.id}:${challenge.versionId}:${session?.attemptsUsed ?? 0}`
              : "none";

          ''',
              "",
          )
          player = player.replace(
              "  }, [challengeKey, challenge]);",
              "  }, [challenge]);",
          )
          player = player.replace(
              '''  useEffect(() => {
              if (feedback) feedbackRef.current?.focus();
            }, [feedback]);

          ''',
              '''  useEffect(() => {
              if (feedback) feedbackRef.current?.focus();
            }, [feedback]);

            useEffect(() => {
              if (session?.state === "completed" && feedback === null) {
                window.sessionStorage.removeItem(storageKey);
              }
            }, [feedback, session?.state, storageKey]);

          ''',
          )
          player = player.replace(
              '''  if (session.state === "completed" && feedback === null) {
              window.sessionStorage.removeItem(storageKey);
              return (
          ''',
              '''  if (session.state === "completed" && feedback === null) {
              return (
          ''',
          )
          player = player.replace(
              '''          <div
                className={styles["score"]}
                aria-label={`${session.awardedPoints} out of ${session.maxPoints} points`}
              >
          ''',
              '''          <div
                className={styles["score"]}
                role="meter"
                aria-label={`${session.awardedPoints} out of ${session.maxPoints} points`}
                aria-valuemin={0}
                aria-valuemax={session.maxPoints}
                aria-valuenow={session.awardedPoints}
              >
          ''',
          )
          player_path.write_text(player, encoding="utf-8")

          package_path = Path("package.json")
          package = package_path.read_text(encoding="utf-8")
          package_path.write_text(
              package.replace(
                  '"lint": "biome lint --max-diagnostics=300 ."',
                  '"lint": "biome lint ."',
              ),
              encoding="utf-8",
          )
          PY

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "fix(web): resolve playable-level quality findings"
            git push origin HEAD:feat/23-playable-level-web
          fi
