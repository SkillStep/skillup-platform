name: UAT Live Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect live UAT blockers
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Inspect AI worker and API claim failure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/skillup
            echo '=== LIVE RELEASE ==='
            grep -E '^(RELEASE_SHA|RELEASE_PIPELINE_ID|AI_RELEASE_ARTIFACT_REF|AI_RELEASE_IMAGE_DIGEST)=' .env || true
            echo '=== AI WORKER STATE ==='
            docker inspect -f 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} restart={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' skillup-ai-worker-staging-container || true
            echo '=== SANITIZED AI WORKER LOG TAIL ==='
            docker logs --tail 120 skillup-ai-worker-staging-container 2>&1 \
              | sed -E 's/(api[_ -]?key|authorization|token|secret|password)([=: ]+)[^ ,}]+/\1\2[REDACTED]/Ig' \
              | tail -120 || true
            echo '=== SANITIZED API LOG TAIL ==='
            docker logs --tail 500 skillup-api-staging-container 2>&1 \
              | sed -E 's/(api[_ -]?key|authorization|cookie|token|secret|password)([=: ]+)[^ ,}]+/\1\2[REDACTED]/Ig' \
              | grep -E -i 'ai|claim|internal_error|error|500' \
              | tail -180 || true
            echo '=== RECENT AI REQUEST STATE ==='
            docker exec -i skillup-api-staging-container node --input-type=module <<'NODE'
            import pg from 'pg';
            const { Pool } = pg;
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
            try {
              const requests = await pool.query(
                `select id, task, status, provider, model, attempt_count, created_at, started_at,
                        completed_at, next_attempt_at, lease_expires_at, cancelled_at,
                        left(coalesce(last_error,''),500) as last_error, correlation_id
                   from ai_generation_requests
                  order by created_at desc limit 12`);
              const attempts = await pool.query(
                `select a.request_id, a.attempt_number, a.status, a.provider, a.model,
                        a.started_at, a.completed_at, a.error_code,
                        left(coalesce(a.error_message,''),500) as error_message,
                        a.estimated_cost_microusd
                   from ai_job_attempts a
                  order by a.started_at desc limit 20`);
              console.log(JSON.stringify({ requests: requests.rows, attempts: attempts.rows }, null, 2));
            } finally {
              await pool.end();
            }
            NODE
