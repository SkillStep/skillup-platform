name: Format internal go-live wave

on:
  push:
    branches:
      - feat/internal-go-live-authorities
    paths:
      - .github/workflows/format-internal-go-live.yml

permissions:
  contents: write

concurrency:
  group: format-internal-go-live
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/internal-go-live-authorities
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format the internal go-live files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome format --write \
            apps/api/src/account-lifecycle.ts \
            apps/api/src/ai-job-service.ts \
            apps/api/src/analytics-service.ts \
            apps/api/src/capabilities.ts \
            apps/api/src/commercial-automation.ts \
            apps/api/src/content-operations.ts \
            packages/database/src/cli/complete-launch-smoke.ts \
            packages/database/src/cli/smoke.ts \
            packages/database/src/complete-launch-curriculum.ts \
            packages/database/src/complete-launch-seed-v2.ts
          git rm .github/workflows/format-internal-go-live.yml

      - name: Commit and push formatting
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format internal go-live implementation"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:feat/internal-go-live-authorities
