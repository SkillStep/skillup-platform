name: Prepare staging deployment branch

on:
  push:
    branches:
      - feat/17-staging-deployment-and-live-auth

permissions:
  contents: write

concurrency:
  group: prepare-staging-deployment-branch
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/17-staging-deployment-and-live-auth
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Update lockfile and format reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock and format staging deployment foundation"
            git push origin HEAD:feat/17-staging-deployment-and-live-auth
          fi
