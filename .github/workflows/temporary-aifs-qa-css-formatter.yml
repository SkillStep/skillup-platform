name: Temporary AIFS QA CSS formatter
on:
  push:
    branches:
      - feat/aifs-certificate-qa-mobile-history-20261116
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'SkillStep/skillup-platform' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          ref: feat/aifs-certificate-qa-mobile-history-20261116
      - name: Pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Install pinned formatter
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Format responsive footer CSS only
        run: |
          pnpm exec biome format --write "apps/web/app/[locale]/discovery.module.css"
      - name: Commit CSS correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "apps/web/app/[locale]/discovery.module.css"
          if ! git diff --cached --quiet; then
            git commit -m "style(web): format overflow fix with pinned Biome"
            git push origin HEAD:feat/aifs-certificate-qa-mobile-history-20261116
          fi
