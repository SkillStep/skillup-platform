name: Format content operations

on:
  push:
    branches:
      - feat/internal-go-live-authorities
    paths:
      - .github/workflows/format-content-operations.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/internal-go-live-authorities
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          check-latest: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and remove helper
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome format --write apps/api/src/content-operations.ts
          git rm .github/workflows/format-content-operations.yml

      - name: Commit and push
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "waseem99"
          git config user.email "mwaseemkha@gmail.com"
          git add --all
          git commit -m "style: normalize content operations routes"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:feat/internal-go-live-authorities
