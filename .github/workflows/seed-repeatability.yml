name: Quality CI - Repeatable Seed

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seed-repeatability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeatable-seed:
    name: Repeat seed on persistent PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://skillup_local:skillup_local_only@127.0.0.1:5432/skillup
      POSTGRES_DB: skillup
      POSTGRES_USER: skillup_local
      POSTGRES_PASSWORD: skillup_local_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove seed is repeatable after publication
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose -f infra/compose.yaml down -v' EXIT
          docker compose -f infra/compose.yaml up -d postgres
          pnpm db:wait
          pnpm db:migrate

          echo "FIRST SEED"
          pnpm db:seed
          pnpm db:smoke

          echo "SECOND SEED AGAINST THE SAME PERSISTENT DATABASE"
          pnpm db:seed
          pnpm db:smoke

          echo "REPEATABLE SEED: PASS"
