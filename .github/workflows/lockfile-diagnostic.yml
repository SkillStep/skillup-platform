name: Dependency Lockfile Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/lockfile-diagnostic.yml
      - pnpm-workspace.yaml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate patched lockfile artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Generate secure lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm audit --prod --audit-level=high

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
