name: Dependency Lockfile Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/lockfile-diagnostic.yml
      - pnpm-workspace.yaml
      - pnpm-lock.yaml

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate patched lockfile artifact
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'waseem99'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout owner branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Generate and audit secure lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm audit --prod --audit-level=high

      - name: Commit audited lockfile to owner branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "The audited lockfile is already current."
            exit 0
          fi
          git config user.name "SkillUp CI"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security: refresh audited dependency lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
