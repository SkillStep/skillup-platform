name: Agent OTP SQL Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/auth-otp-postgres-typing-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: fix/auth-otp-postgres-typing-20260819
          fetch-depth: 0
      - name: Patch the ambiguous PostgreSQL session insert and add a real-DB regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('apps/api/src/auth.ts')
          text=path.read_text()
          old="values ($1, $2, $3, least($4, $3), $5, $5)"
          new="values ($1, $2, $3::timestamptz, least($4::timestamptz, $3::timestamptz), $5::timestamptz, $5::timestamptz)"
          if old in text:
              text=text.replace(old,new,1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Expected auth session INSERT pattern was not found')
          PY
          cat > apps/api/src/auth-postgres.test.ts <<'TS'
          import { randomUUID } from "node:crypto";

          import { Pool } from "pg";
          import { afterAll, describe, expect, it } from "vitest";

          import { createAuthService } from "./auth.js";

          const databaseUrl = process.env["DATABASE_URL"];
          const describeWithPostgres = databaseUrl ? describe : describe.skip;
          const pool = databaseUrl
            ? new Pool({ connectionString: databaseUrl, max: 2, allowExitOnIdle: true })
            : null;

          afterAll(async () => {
            await pool?.end();
          });

          describeWithPostgres("passwordless auth against PostgreSQL", () => {
            it("creates a first-time learner session without ambiguous timestamp parameters", async () => {
              if (!pool) throw new Error("DATABASE_URL is required for the PostgreSQL auth regression.");

              const email = `auth-regression-${randomUUID()}@example.test`;
              const now = new Date();
              const code = "1234";
              let deliveredCode = "";
              let userId: string | null = null;

              const auth = createAuthService({
                pool,
                secret: "ci-auth-regression-secret-at-least-32-bytes",
                challengeMinutes: 10,
                sessionIdleMinutes: 60,
                sessionAbsoluteHours: 168,
                now: () => now,
                createCode: () => code,
                delivery: {
                  sendSignInCode: async (message) => {
                    deliveredCode = message.code;
                  },
                },
              });

              try {
                const challenge = await auth.startEmailSignIn({
                  email,
                  requestFingerprint: `auth-regression-${randomUUID()}`,
                });
                expect(deliveredCode).toBe(code);

                const verified = await auth.verifyEmailSignIn({
                  challengeId: challenge.challengeId,
                  code,
                });
                userId = verified.learner.id;
                expect(verified.learner.email).toBe(email);

                const resolved = await auth.resolveSession(verified.sessionToken);
                expect(resolved?.id).toBe(userId);
                expect(resolved?.email).toBe(email);
              } finally {
                if (userId) await pool.query("delete from users where id = $1", [userId]);
                await pool.query("delete from auth_challenges where email_normalized = $1", [email]);
              }
            });
          });
          TS
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/api/src/auth.ts apps/api/src/auth-postgres.test.ts
          pnpm --filter @skillup/api typecheck
          git diff --check
      - name: Commit source repair only
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/src/auth.ts apps/api/src/auth-postgres.test.ts
          if git diff --cached --quiet; then
            echo 'Source repair already committed.'
            exit 0
          fi
          git config user.name 'skillup-ci-bot'
          git config user.email 'skillup-ci-bot@users.noreply.github.com'
          git commit -m 'fix: type OTP session timestamps explicitly'
          git push origin HEAD:fix/auth-otp-postgres-typing-20260819
