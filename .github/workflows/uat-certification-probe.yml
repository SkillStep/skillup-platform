name: UAT Certification Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: uat-certification-probe
  cancel-in-progress: true

jobs:
  certify:
    name: Certify live staging excluding external JazzCash
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    env:
      STAGING_WEB_URL: https://skillupshop.codistan.org
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_QA_RUN_ID: uat-${{ github.run_id }}-${{ github.run_attempt }}
      STAGING_JAZZCASH_SANDBOX_READY: "false"
      STAGING_VISUAL_BASELINES_APPROVED: "false"
      STAGING_QA_LEARNER_EMAIL: skillup+qa-learner@codistan.org
      STAGING_QA_FREE_LEARNER_EMAIL: skillup+qa-free-learner@codistan.org
      STAGING_QA_ONBOARDING_EMAIL: skillup+qa-onboarding@codistan.org
      STAGING_QA_AUTH_NEGATIVE_EMAIL: skillup+qa-auth-negative@codistan.org
      STAGING_QA_SESSION_EMAIL: skillup+qa-session@codistan.org
      STAGING_QA_ADMIN_EMAIL: skillup+qa-admin@codistan.org
      STAGING_QA_ANALYST_EMAIL: skillup+qa-analyst@codistan.org
      STAGING_QA_CONTENT_EDITOR_EMAIL: skillup+qa-content-editor@codistan.org
      STAGING_QA_CONTENT_REVIEWER_EMAIL: skillup+qa-content-reviewer@codistan.org
      STAGING_QA_PUBLISHER_EMAIL: skillup+qa-publisher@codistan.org
      STAGING_QA_PAYMENT_OPERATOR_EMAIL: skillup+qa-payment-operator@codistan.org
      STAGING_QA_LEARNER_SUPPORT_EMAIL: skillup+qa-learner-support@codistan.org
      STAGING_QA_SECURITY_ADMIN_EMAIL: skillup+qa-security-admin@codistan.org
      STAGING_QA_REVOKED_ADMIN_EMAIL: skillup+qa-revoked-admin@codistan.org

    steps:
      - name: Checkout QA probe
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked workspace and Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @skillup/staging-certification exec playwright install --with-deps chromium

      - name: Prove exact live candidate and export immutable identity
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: 8dd0fb92470fc847dd8eeef0f98fd0daf0cddd8e
        run: |
          set -euo pipefail
          base="$STAGING_WEB_URL"
          web_health="$(curl --fail --silent --show-error --max-time 15 "$base/api/health")"
          api_version="$(curl --fail --silent --show-error --max-time 15 "$base/api/v1/version")"
          api_ready="$(curl --fail --silent --show-error --max-time 15 "$base/api/v1/ready")"

          WEB_HEALTH="$web_health" API_VERSION="$api_version" API_READY="$api_ready" EXPECTED_RELEASE_SHA="$EXPECTED_RELEASE_SHA" node <<'NODE' >> "$GITHUB_ENV"
          const web = JSON.parse(process.env.WEB_HEALTH);
          const api = JSON.parse(process.env.API_VERSION);
          const ready = JSON.parse(process.env.API_READY);
          const expected = process.env.EXPECTED_RELEASE_SHA;
          if (web.status !== "ok" || web.releaseSha !== expected || api.releaseSha !== expected || ready.releaseSha !== expected) {
            throw new Error(`Staging is not running the locked candidate ${expected}.`);
          }
          if (ready.status !== "ok") throw new Error("API database readiness is not healthy.");
          if (!web.pipelineId || !web.artifactRef || !web.imageDigest || !web.rollbackRef) throw new Error("Web release identity is incomplete.");
          if (!api.pipelineId || !api.artifactRef || !api.imageDigest || !api.rollbackRef) throw new Error("API release identity is incomplete.");
          if (web.pipelineId !== api.pipelineId || web.rollbackRef !== api.rollbackRef) throw new Error("Web/API deployment identity is inconsistent.");
          for (const [key, value] of Object.entries({
            STAGING_EXPECTED_RELEASE_SHA: expected,
            STAGING_DEPLOYMENT_PIPELINE_ID: web.pipelineId,
            STAGING_WEB_ARTIFACT_REF: web.artifactRef,
            STAGING_WEB_IMAGE_DIGEST: web.imageDigest,
            STAGING_API_ARTIFACT_REF: api.artifactRef,
            STAGING_API_IMAGE_DIGEST: api.imageDigest,
            STAGING_PREVIOUS_RELEASE_REF: web.rollbackRef,
          })) process.stdout.write(`${key}=${value}\n`);
          NODE

      - name: Run public live smoke
        shell: bash
        run: |
          set -euo pipefail
          SKILLUP_WEB_URL="$STAGING_WEB_URL" \
          SKILLUP_API_URL="$STAGING_API_URL" \
          SKILLUP_EXPECTED_RELEASE_SHA="$STAGING_EXPECTED_RELEASE_SHA" \
          node tools/smoke-live.mjs

      - name: Configure temporary staging SSH client
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/skillup-qa"
          chmod 600 "$HOME/.ssh/skillup-qa"
          ssh-keyscan -H "$STAGING_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create audited staging QA identities, roles, entitlements and temporary sessions
        shell: bash
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          state_json="$(
            ssh -T \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -i "$HOME/.ssh/skillup-qa" \
              "$STAGING_SSH_USER@$STAGING_HOST" \
              'set -euo pipefail
               cd /opt/skillup
               test -f .env
               expected="8dd0fb92470fc847dd8eeef0f98fd0daf0cddd8e"
               running_sha="$(grep "^RELEASE_SHA=" .env | tail -1 | cut -d= -f2-)"
               test "$running_sha" = "$expected"
               ai_ref="$(grep "^AI_RELEASE_ARTIFACT_REF=" .env | tail -1 | cut -d= -f2-)"
               ai_digest="$(grep "^AI_RELEASE_IMAGE_DIGEST=" .env | tail -1 | cut -d= -f2-)"
               case "$ai_ref" in *"$expected"*) ;; *) echo "AI artifact identity does not match candidate release" >&2;; esac
               case "$ai_digest" in sha256:*) ;; *) echo "AI image digest is missing" >&2;; esac
               for container in skillup-postgres-staging-container skillup-api-staging-container skillup-web-staging-container; do
                 test "$(docker inspect -f "{{.State.Running}}" "$container")" = "true" || { echo "Required staging container is not running: $container" >&2; exit 1; }
               done
               if test "$(docker inspect -f "{{.State.Running}}" skillup-ai-worker-staging-container 2>/dev/null || echo false)" = "true"; then
                 echo "AI WORKER RUNTIME: RUNNING" >&2
               else
                 echo "AI WORKER RUNTIME: NOT RUNNING" >&2
                 docker inspect -f "AI worker state={{.State.Status}} exit={{.State.ExitCode}} restart={{.RestartCount}}" skillup-ai-worker-staging-container >&2 2>/dev/null || true
               fi
               exec docker exec -i skillup-api-staging-container node --input-type=module' \
              < qa/staging-certification/provision-live-qa.mjs
          )"

          STATE_JSON="$state_json" STAGING_WEB_URL="$STAGING_WEB_URL" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const payload = JSON.parse(process.env.STATE_JSON);
          const host = new URL(process.env.STAGING_WEB_URL).hostname;
          const root = path.resolve("qa/staging-certification/artifacts/.auth");
          fs.mkdirSync(root, { recursive: true });
          const expires = Math.floor(Date.now() / 1000) + 55 * 60;
          for (const [name, token] of Object.entries(payload.sessions)) {
            fs.writeFileSync(path.join(root, `${name}.json`), JSON.stringify({
              cookies: [{
                name: payload.cookieName,
                value: token,
                domain: host,
                path: "/",
                expires,
                httpOnly: true,
                secure: true,
                sameSite: "Lax",
              }],
              origins: [],
            }));
          }
          NODE
          unset state_json
          echo "AUDITED STAGING QA FIXTURES + TEMPORARY AUTH STATES: PASS"

      - name: Run comprehensive browser certification except true OTP receipt/verify
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification exec playwright test \
            --no-deps \
            --project=public-desktop \
            --project=learner-desktop \
            --project=learner-mobile \
            --project=free-learner-desktop \
            --project=onboarding-desktop \
            --project=admin-desktop \
            --project=analyst-desktop \
            --project=content-editor-desktop \
            --project=content-reviewer-desktop \
            --project=publisher-desktop \
            --project=payment-operator-desktop \
            --project=learner-support-desktop \
            --project=security-admin-desktop \
            --project=revoked-admin-desktop \
            --grep-invert 'passwordless sign-in delivers and verifies a real staging OTP|wrong OTP is rejected and a consumed challenge cannot be replayed|revoking the current session invalidates that session server-side'

      - name: Write UAT probe scope evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/staging-certification
          cat > artifacts/staging-certification/uat-probe-scope.md <<'EOF'
          # SkillUp staging UAT probe

          - Locked release: 8dd0fb92470fc847dd8eeef0f98fd0daf0cddd8e
          - External JazzCash provider checkout: intentionally excluded
          - True OTP mailbox receipt/verification: blocked by missing STAGING_QA_MAILBOX_URL/TOKEN
          - Authenticated application coverage: exercised through audited staging-only deterministic QA users and temporary server-valid sessions
          - Playwright retries: 0
          - Visual regression: not included because approved baselines are not configured
          EOF

      - name: Remove sensitive temporary authentication state and SSH key
        if: always()
        shell: bash
        run: |
          rm -rf qa/staging-certification/artifacts/.auth
          rm -f "$HOME/.ssh/skillup-qa"

      - name: Upload sanitized UAT certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-certification-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/staging-certification
            qa/staging-certification/artifacts/html
            qa/staging-certification/artifacts/test-results
            qa/staging-certification/artifacts/playwright-results.json
          if-no-files-found: warn
          retention-days: 14
