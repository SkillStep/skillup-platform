name: Agent Retry Ledger Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-retry-ledger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed retry-ledger patch
    if: github.repository == 'SkillStep/skillup-platform' && github.event.pull_request.head.ref == 'agent/ai-provider-gateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agent/ai-provider-gateway
          fetch-depth: 0

      - name: Apply patch and remove staging file
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .agent/retry-ledger.patch ]]; then
            echo "Retry-ledger patch already applied."
            exit 0
          fi
          patch -p1 < .agent/retry-ledger.patch
          rm -rf .agent
          git config user.name "SkillUp CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: allow durable AI jobs to retry safely"
          git push origin HEAD:agent/ai-provider-gateway
