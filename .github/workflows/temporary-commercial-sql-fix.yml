name: Temporary commercial SQL repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-commercial-sql-fix.yml

permissions:
  contents: write

jobs:
  repair:
    name: Apply exact PostgreSQL parameter casts
    if: github.head_ref == 'feat/launch-commercial-content-ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/launch-commercial-content-ops

      - name: Patch exact entitlement timestamp expression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/api/src/commercial.ts")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)\$4,\n"
              r"(?P=indent)case when \$5 = 'month' then \$4 \+ interval '1 month' else \$4 \+ interval '1 year' end,\n"
              r"(?P=indent)\$4,\n"
              r"(?P=indent)\$4$"
          )

          def replacement(match: re.Match[str]) -> str:
              indent = match.group("indent")
              return "\n".join(
                  [
                      f"{indent}$4::timestamptz,",
                      f"{indent}case",
                      f"{indent}  when $5::text = 'month'",
                      f"{indent}    then $4::timestamptz + interval '1 month'",
                      f"{indent}  else $4::timestamptz + interval '1 year'",
                      f"{indent}end,",
                      f"{indent}$4::timestamptz,",
                      f"{indent}$4::timestamptz",
                  ]
              )

          updated, count = pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f"Expected exactly one SQL expression to patch; found {count}.")
          path.write_text(updated, encoding="utf-8")
          PY

          git diff --check
          git diff -- apps/api/src/commercial.ts

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "skillup-ci-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/commercial.ts
          git commit -m "fix(api): cast entitlement timestamp parameters"
          git push origin HEAD:feat/launch-commercial-content-ops
