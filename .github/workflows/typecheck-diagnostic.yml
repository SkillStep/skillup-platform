name: CPS Typecheck Diagnostic

on:
  push:
    branches:
      - release/jazzcash-cps-sandbox-readiness

permissions:
  contents: read

jobs:
  api-typecheck:
    name: Isolated API typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm shared:build

      - name: Typecheck API only
        run: pnpm --filter @skillup/api typecheck
