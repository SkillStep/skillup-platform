name: Diagnose Auth PostgreSQL Second Error

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/auth-otp-postgres-typing-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://skillup_local:skillup_local_only@127.0.0.1:5432/skillup
      POSTGRES_DB: skillup
      POSTGRES_USER: skillup_local
      POSTGRES_PASSWORD: skillup_local_only
      PUBLIC_APP_URL: https://skillup.example
      SESSION_SECRET: ci-only-session-secret-at-least-32-random-bytes
      EMAIL_PROVIDER: disabled
      FEATURE_AI_GENERATION_ENABLED: "false"
      AI_PROVIDER: disabled
      AI_FALLBACK_PROVIDER: disabled
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Install and migrate local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          docker compose -f infra/compose.yaml up -d postgres
          pnpm db:wait
          pnpm db:migrate
          pnpm db:seed
          pnpm shared:build
      - name: Run isolated auth diagnostic with safe DB error fields
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/api/src/auth-postgres-diag.test.ts <<'TS'
          import { randomUUID } from "node:crypto";
          import { Pool } from "pg";
          import { afterAll, describe, expect, it } from "vitest";
          import { createAuthService } from "./auth.js";

          const pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 2, allowExitOnIdle: true });
          afterAll(async () => { await pool.end(); });

          function safeError(error: unknown) {
            if (!(error instanceof Error)) return { value: String(error) };
            const row = error as Error & Record<string, unknown>;
            const cause = row.cause instanceof Error ? (row.cause as Error & Record<string, unknown>) : null;
            const pick = (source: Record<string, unknown> | null) => source ? {
              name: source.name,
              message: source.message,
              code: source.code,
              detail: source.detail,
              hint: source.hint,
              where: source.where,
              constraint: source.constraint,
              table: source.table,
              column: source.column,
              dataType: source.dataType,
              routine: source.routine,
            } : null;
            return { top: pick(row), cause: pick(cause) };
          }

          describe("auth PostgreSQL diagnostic", () => {
            it("reports only safe error metadata", async () => {
              const email = `auth-diag-${randomUUID()}@example.test`;
              const now = new Date();
              const code = "1234";
              const auth = createAuthService({
                pool,
                secret: "ci-auth-regression-secret-at-least-32-bytes",
                challengeMinutes: 10,
                sessionIdleMinutes: 60,
                sessionAbsoluteHours: 168,
                now: () => now,
                createCode: () => code,
                delivery: { sendSignInCode: async () => undefined },
              });
              try {
                const challenge = await auth.startEmailSignIn({ email, requestFingerprint: `diag-${randomUUID()}` });
                try {
                  const verified = await auth.verifyEmailSignIn({ challengeId: challenge.challengeId, code });
                  expect(verified.learner.email).toBe(email);
                  console.log("AUTH_DIAGNOSTIC=PASS");
                } catch (error) {
                  console.error("AUTH_DIAGNOSTIC_ERROR=" + JSON.stringify(safeError(error)));
                  throw error;
                }
              } finally {
                await pool.query("delete from users where id in (select user_id from user_email_identities where email_normalized = $1)", [email]);
                await pool.query("delete from auth_challenges where email_normalized = $1", [email]);
              }
            });
          });
          TS
          pnpm --filter @skillup/api exec vitest run src/auth-postgres-diag.test.ts --reporter=verbose
