name: Diagnose Auth PostgreSQL Second Error

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/auth-otp-postgres-typing-20260819'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://skillup_local:skillup_local_only@127.0.0.1:5432/skillup
      POSTGRES_DB: skillup
      POSTGRES_USER: skillup_local
      POSTGRES_PASSWORD: skillup_local_only
      PUBLIC_APP_URL: https://skillup.example
      SESSION_SECRET: ci-only-session-secret-at-least-32-random-bytes
      EMAIL_PROVIDER: disabled
      FEATURE_AI_GENERATION_ENABLED: "false"
      AI_PROVIDER: disabled
      AI_FALLBACK_PROVIDER: disabled
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Install and migrate local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          docker compose -f infra/compose.yaml up -d postgres
          pnpm db:wait
          pnpm db:migrate
          pnpm db:seed
      - name: Reproduce full workspace test result and print only auth failure context
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/workspace-tests.log 2>&1
          status=$?
          set -e
          echo "WORKSPACE_TEST_EXIT=$status"
          if [ "$status" -ne 0 ]; then
            grep -n -E -B 20 -A 60 'auth-postgres|EmailIdentity|passwordless auth|FAIL|failed|Error:' /tmp/workspace-tests.log | tail -260 || true
            exit "$status"
          fi
          echo 'FULL_WORKSPACE_TESTS=PASS'
