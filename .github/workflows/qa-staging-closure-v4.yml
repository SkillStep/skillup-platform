name: QA Final Staging Closure V4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-final-staging-fast-closure
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      STAGING_WEB_URL: https://skillupshop.codistan.org
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_JAZZCASH_SANDBOX_READY: "false"
      STAGING_VISUAL_BASELINES_APPROVED: "false"
    steps:
      - name: Checkout exact deployed main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify exact public release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for path in api/health api/v1/version api/v1/ready; do curl -fsS --max-time 15 "$STAGING_WEB_URL/$path" > "/tmp/$(echo "$path" | tr / -).json"; done
          EXPECTED_SHA="$EXPECTED_SHA" python3 - <<'PY'
          import json,os
          sha=os.environ['EXPECTED_SHA']
          web=json.load(open('/tmp/api-health.json')); api=json.load(open('/tmp/api-v1-version.json')); ready=json.load(open('/tmp/api-v1-ready.json'))
          if web.get('status')!='ok' or ready.get('status')!='ok': raise SystemExit('health/readiness failed')
          for label,body in [('web',web),('api',api),('ready',ready)]:
              if body.get('releaseSha')!=sha: raise SystemExit(f'{label} SHA mismatch')
          for label,body in [('web',web),('api',api)]:
              for key in ['pipelineId','artifactRef','imageDigest','rollbackRef']:
                  if not body.get(key): raise SystemExit(f'{label} missing {key}')
          print('EXACT_DEPLOYED_RELEASE=PASS')
          PY

      - name: Open one SSH master and verify staging QA relay
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$STAGING_SSH_KEY" >/tmp/skillup-key; chmod 600 /tmp/skillup-key
          ssh -M -S /tmp/skillup-ssh -fnNT -i /tmp/skillup-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$STAGING_SSH_USER@$STAGING_HOST"
          ssh -S /tmp/skillup-ssh "$STAGING_SSH_USER@$STAGING_HOST" bash -s -- "$EXPECTED_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/skillup
          test "$(sed -n 's/^RELEASE_SHA=//p' .env | tail -1)" = "$1"
          test "$(docker inspect skillup-mailpit-staging-container --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect skillup-api-staging-container --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^SMTP_HOST=//p' | head -1)" = mailpit
          test "$(docker inspect skillup-api-staging-container --format '{{.State.Health.Status}}')" = healthy
          REMOTE
          ssh -S /tmp/skillup-ssh -O forward -L 127.0.0.1:18025:127.0.0.1:18025 "$STAGING_SSH_USER@$STAGING_HOST"
          curl -fsS --max-time 5 'http://127.0.0.1:18025/api/v1/messages?limit=1' >/dev/null
          echo 'STAGING_QA_RELAY=PASS'

      - name: Start protected OTP adapter and identities
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"; echo "::add-mask::$token"
          cat >/tmp/otp-adapter.py <<'PY'
          import json,os,re,urllib.error,urllib.parse,urllib.request
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          TOKEN=os.environ['TOKEN']; MP='http://127.0.0.1:18025'
          class H(BaseHTTPRequestHandler):
            def log_message(self,*_): pass
            def out(self,s,b):
              p=json.dumps(b).encode(); self.send_response(s); self.send_header('Content-Type','application/json'); self.send_header('Cache-Control','no-store'); self.send_header('Content-Length',str(len(p))); self.end_headers(); self.wfile.write(p)
            def do_GET(self):
              if self.headers.get('Authorization')!='Bearer '+TOKEN: return self.out(401,{'message':'unauthorized'})
              q=urllib.parse.parse_qs(urllib.parse.urlsplit(self.path).query); email=(q.get('email') or [''])[0].strip().lower()
              if not email: return self.out(400,{'message':'email required'})
              url=MP+'/view/latest.txt?'+urllib.parse.urlencode({'query':f'to:"{email}"'})
              try:
                with urllib.request.urlopen(url,timeout=5) as r: text=r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                return self.out(404 if e.code==404 else 503,{'message':'not found' if e.code==404 else 'mailbox unavailable'})
              except Exception: return self.out(503,{'message':'mailbox unavailable'})
              m=re.search(r'(?is)(?:sign[- ]?in|verification|code)[^0-9]{0,160}([0-9]{4})(?![0-9])',text) or re.search(r'(?<![0-9])([0-9]{4})(?![0-9])',text)
              return self.out(200,{'code':m.group(1)}) if m else self.out(404,{'message':'OTP not found'})
          ThreadingHTTPServer(('127.0.0.1',18026),H).serve_forever()
          PY
          TOKEN="$token" python3 /tmp/otp-adapter.py >/tmp/otp-adapter.log 2>&1 & echo $! >/tmp/otp-adapter.pid
          for i in $(seq 1 15); do code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" 'http://127.0.0.1:18026/?email=none@skillup.test' || true)"; [ "$code" = 404 ] && break; sleep 1; done
          [ "${code:-}" = 404 ] || { cat /tmp/otp-adapter.log >&2 || true; exit 23; }
          {
            echo 'STAGING_QA_MAILBOX_URL=http://127.0.0.1:18026/'
            echo "STAGING_QA_MAILBOX_TOKEN=$token"
            echo "STAGING_QA_LEARNER_EMAIL=qa-learner-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_FREE_LEARNER_EMAIL=qa-free-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_ONBOARDING_EMAIL=qa-onboarding-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_AUTH_NEGATIVE_EMAIL=qa-auth-negative-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_SESSION_EMAIL=qa-session-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_ADMIN_EMAIL=qa-admin-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_ANALYST_EMAIL=qa-analyst-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_CONTENT_EDITOR_EMAIL=qa-content-editor-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_CONTENT_REVIEWER_EMAIL=qa-content-reviewer-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_PUBLISHER_EMAIL=qa-publisher-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_PAYMENT_OPERATOR_EMAIL=qa-payment-operator-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_LEARNER_SUPPORT_EMAIL=qa-learner-support-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_SECURITY_ADMIN_EMAIL=qa-security-admin-${GITHUB_RUN_ID}@skillup.test"
            echo "STAGING_QA_REVOKED_ADMIN_EMAIL=qa-revoked-admin-${GITHUB_RUN_ID}@skillup.test"
          } >>"$GITHUB_ENV"
          echo 'OTP_ADAPTER=PASS'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version

      - name: Install locked workspace and Chromium only
        shell: bash
        run: |
          set -euo pipefail
          corepack enable; corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @skillup/staging-certification exec playwright install chromium

      - name: Real OTP browser states
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification exec playwright test --project=auth-setup --reporter=line
          test -f qa/staging-certification/artifacts/.auth/learner.json
          test -f qa/staging-certification/artifacts/.auth/admin.json
          echo 'REAL_OTP_AUTH=PASS'

      - name: Bootstrap audited role fixtures
        shell: bash
        run: |
          set -euo pipefail
          bootstrap(){ email="$1"; roles="$2"; ssh -S /tmp/skillup-ssh "$STAGING_SSH_USER@$STAGING_HOST" bash -s -- "$email" "$roles" <<'REMOTE'
          set -euo pipefail
          email="$1"; roles="$2"; c=skillup-api-staging-container
          cli="$(docker exec "$c" sh -lc 'for p in /app/node_modules/@skillup/database/dist/cli/admin-bootstrap.js /workspace/node_modules/@skillup/database/dist/cli/admin-bootstrap.js; do [ -f "$p" ] && { echo "$p"; exit; }; done; find /app /workspace -path "*/dist/cli/admin-bootstrap.js" -print -quit 2>/dev/null' | tail -1)"; test -n "$cli"
          docker exec -e ADMIN_BOOTSTRAP_CONFIRM=I_UNDERSTAND_THIS_GRANTS_PRIVILEGED_ACCESS -e ADMIN_BOOTSTRAP_EMAIL="$email" -e ADMIN_BOOTSTRAP_REASON='Automated staging certification role fixture' -e ADMIN_BOOTSTRAP_ROLES="$roles" "$c" node "$cli" >/dev/null
          REMOTE
          }
          bootstrap "$STAGING_QA_ADMIN_EMAIL" 'content_editor,content_reviewer,publisher,learner_support,payment_operator,analyst,security_admin'
          bootstrap "$STAGING_QA_ANALYST_EMAIL" analyst
          bootstrap "$STAGING_QA_CONTENT_EDITOR_EMAIL" content_editor
          bootstrap "$STAGING_QA_CONTENT_REVIEWER_EMAIL" content_reviewer
          bootstrap "$STAGING_QA_PUBLISHER_EMAIL" publisher
          bootstrap "$STAGING_QA_PAYMENT_OPERATOR_EMAIL" payment_operator
          bootstrap "$STAGING_QA_LEARNER_SUPPORT_EMAIL" learner_support
          bootstrap "$STAGING_QA_SECURITY_ADMIN_EMAIL" security_admin
          echo 'RBAC_FIXTURES=PASS'

      - name: Premium entitlement
        shell: bash
        run: |
          set -euo pipefail
          cat >qa/staging-certification/grant-premium.mjs <<'NODE'
          import { request } from '@playwright/test';
          const baseURL=process.env.STAGING_WEB_URL, origin=new URL(baseURL).origin;
          const learner=await request.newContext({baseURL,storageState:'qa/staging-certification/artifacts/.auth/learner.json',extraHTTPHeaders:{origin}});
          const admin=await request.newContext({baseURL,storageState:'qa/staging-certification/artifacts/.auth/admin.json',extraHTTPHeaders:{origin}});
          try{
            const s=await learner.get('/api/v1/auth/session'); if(!s.ok()) throw new Error(`session ${s.status()}`); const userId=(await s.json()).learner?.id; if(!userId) throw new Error('user id missing');
            let c=await learner.get('/api/v1/account/capabilities'); if(!c.ok()) throw new Error(`capabilities ${c.status()}`);
            if((await c.json()).tier!=='premium'){
              const p=await admin.get('/api/v1/admin/reports/premium/plans'); if(!p.ok()) throw new Error(`plans ${p.status()}: ${(await p.text()).slice(0,200)}`);
              const body=await p.json(), active=(body.plans??[]).filter(x=>x.versionStatus==='active'), plan=active.find(x=>x.planCode==='premium-monthly')??active[0]; if(!plan?.versionId) throw new Error('active premium plan missing');
              const g=await admin.post('/api/v1/admin/reports/premium/memberships/manual-grants',{data:{userId,planVersionId:plan.versionId,startsAt:new Date(Date.now()-300000).toISOString(),endsAt:new Date(Date.now()+31*86400000).toISOString(),reason:'Automated staging certification Premium fixture',evidenceReference:`qa-${process.env.GITHUB_RUN_ID}`}}); if(!g.ok()) throw new Error(`grant ${g.status()}: ${(await g.text()).slice(0,300)}`);
            }
            c=await learner.get('/api/v1/account/capabilities'); if(!c.ok()||(await c.json()).tier!=='premium') throw new Error('premium tier not proven'); console.log('PREMIUM=PASS');
          }finally{await learner.dispose();await admin.dispose();}
          NODE
          node qa/staging-certification/grant-premium.mjs
          rm qa/staging-certification/grant-premium.mjs

      - name: Full authenticated Playwright
        shell: bash
        run: |
          set -euo pipefail
          projects=(public-desktop learner-desktop learner-mobile free-learner-desktop onboarding-desktop admin-desktop analyst-desktop content-editor-desktop content-reviewer-desktop publisher-desktop payment-operator-desktop learner-support-desktop security-admin-desktop revoked-admin-desktop)
          args=(); for p in "${projects[@]}"; do args+=(--project="$p"); done
          pnpm --filter @skillup/staging-certification exec playwright test --no-deps --grep-invert @visual "${args[@]}" --reporter=line
          echo 'FUNCTIONAL_PLAYWRIGHT=PASS'

      - name: Visual regression capture and repeat
        shell: bash
        run: |
          set -euo pipefail
          STAGING_VISUAL_BASELINES_APPROVED=true pnpm --filter @skillup/staging-certification exec playwright test --no-deps --project=visual-desktop --project=visual-learner-desktop --update-snapshots --reporter=line
          STAGING_VISUAL_BASELINES_APPROVED=true pnpm --filter @skillup/staging-certification exec playwright test --no-deps --project=visual-desktop --project=visual-learner-desktop --reporter=line
          echo 'VISUALS=PASS'

      - name: Live DeepSeek evaluation
        shell: bash
        run: |
          set -euo pipefail
          report="$(ssh -S /tmp/skillup-ssh "$STAGING_SSH_USER@$STAGING_HOST" "docker exec -e AI_EVALUATION_LIVE=true skillup-ai-worker-staging-container python -m skillup_ai_worker.evaluate")"
          REPORT="$report" python3 - <<'PY'
          import json,os
          r=json.loads(os.environ['REPORT']); providers={str(x.get('provider')) for x in r.get('results',[]) if x.get('provider')}
          if r.get('status')!='passed' or r.get('failed')!=0 or r.get('passed')!=r.get('cases') or 'deepseek' not in providers: raise SystemExit('DeepSeek evaluation failed')
          print(f"DEEPSEEK=PASS ({r.get('passed')}/{r.get('cases')})")
          PY

      - name: Final evidence
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p artifacts/staging-closure
          python3 - <<'PY'
          import json,os,datetime
          e={'schemaVersion':'skillup-staging-closure-v1','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'releaseSha':os.environ['RELEASE_SHA'],'deploymentIdentity':'PASS','publicEdgeAndDatabase':'PASS','smtpCaptureAndRealOtp':'PASS','authenticatedFunctionalPlaywright':'PASS','adminRoleFixtures':'PASS','premiumLearnerFixture':'PASS','visualRegression':'PASS','deepSeekLiveEvaluation':'PASS','payments':{'status':'BLOCKED','detail':'JazzCash sandbox/merchant credentials not configured.'},'decision':'READY EXCEPT JAZZCASH'}
          json.dump(e,open('artifacts/staging-closure/closure.json','w'),indent=2); print('FINAL_STAGING_DECISION=READY EXCEPT JAZZCASH')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-staging-closure-v4-${{ github.run_id }}
          path: |
            artifacts/staging-closure
            qa/staging-certification/artifacts/html
            qa/staging-certification/artifacts/test-results
            qa/staging-certification/artifacts/playwright-results.json
            qa/staging-certification/tests/**/*-snapshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          [ -f /tmp/otp-adapter.pid ] && kill "$(cat /tmp/otp-adapter.pid)" 2>/dev/null || true
          ssh -S /tmp/skillup-ssh -O exit "$STAGING_SSH_USER@$STAGING_HOST" 2>/dev/null || true
          rm -f /tmp/skillup-key /tmp/skillup-ssh /tmp/otp-adapter.py qa/staging-certification/grant-premium.mjs