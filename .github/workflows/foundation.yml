name: Quality CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, validate, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      APP_ENV: test
      AI_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      DATABASE_URL: postgresql://skillup_local:skillup_local_only@127.0.0.1:5432/skillup
      POSTGRES_DB: skillup
      POSTGRES_USER: skillup_local
      POSTGRES_PASSWORD: skillup_local_only
      PUBLIC_APP_URL: https://skillup.example
      SESSION_SECRET: ci-only-session-secret-at-least-32-random-bytes
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove unrelated automated lint changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            apps/api/src/auth.ts \
            apps/web/app/layout.tsx \
            apps/web/app/robots.ts \
            apps/web/app/sitemap.ts \
            packages/database/drizzle.config.ts \
            packages/database/src/cli/smoke.ts \
            packages/database/src/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove unrelated lint-only changes"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Validate local infrastructure configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/compose.yaml config --quiet

      - name: Start PostgreSQL and validate migrations
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/compose.yaml up -d postgres
          pnpm db:wait
          pnpm db:migrate
          pnpm db:seed
          pnpm db:smoke

      - name: Validate repository and application quality
        run: pnpm check

      - name: Smoke API against migrated PostgreSQL
        run: pnpm smoke:api

      - name: Stop local infrastructure
        if: always()
        run: docker compose -f infra/compose.yaml down -v
