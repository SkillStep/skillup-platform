name: Quality CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, validate, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      APP_ENV: test
      FEATURE_AI_GENERATION_ENABLED: "false"
      AI_PROVIDER: disabled
      AI_FALLBACK_PROVIDER: disabled
      EMAIL_PROVIDER: disabled
      DATABASE_URL: postgresql://skillup_local:skillup_local_only@127.0.0.1:5432/skillup
      POSTGRES_DB: skillup
      POSTGRES_USER: skillup_local
      POSTGRES_PASSWORD: skillup_local_only
      PUBLIC_APP_URL: https://skillup.example
      SESSION_SECRET: ci-only-session-secret-at-least-32-random-bytes
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject high-severity production dependency findings
        run: pnpm audit --prod --audit-level=high

      - name: Validate local infrastructure configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/compose.yaml config --quiet

      - name: Start PostgreSQL and validate migrations
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/compose.yaml up -d postgres
          pnpm db:wait
          pnpm db:migrate
          pnpm db:seed
          pnpm db:smoke

      - name: Validate repository foundation
        run: pnpm foundation:check

      - name: Validate deployment configuration
        run: pnpm deployment:check

      - name: Validate production-readiness contract
        run: pnpm production:check

      - name: Scan committed content for secrets
        run: pnpm security:secrets

      - name: Check repository formatting
        run: pnpm format:check

      - name: Lint repository
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run workspace tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Build reviewed production containers
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg RELEASE_SHA="$RELEASE_SHA" --file infra/docker/api.Dockerfile --tag skillup-api:${{ github.sha }} .
          docker build --build-arg RELEASE_SHA="$RELEASE_SHA" --file infra/docker/web.Dockerfile --tag skillup-web:${{ github.sha }} .
          docker build --build-arg RELEASE_SHA="$RELEASE_SHA" --file infra/docker/ai-worker.Dockerfile --tag skillup-ai-worker:${{ github.sha }} .
          test "$(docker image inspect skillup-api:${{ github.sha }} --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect skillup-web:${{ github.sha }} --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect skillup-ai-worker:${{ github.sha }} --format '{{.Config.User}}')" = "skillup-ai"
          test "$(docker image inspect skillup-api:${{ github.sha }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"
          test "$(docker image inspect skillup-web:${{ github.sha }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"
          test "$(docker image inspect skillup-ai-worker:${{ github.sha }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"

      - name: Smoke disabled AI worker image
        shell: bash
        run: |
          set -euo pipefail
          output="$(docker run --rm \
            --env APP_ENV=staging \
            --env FEATURE_AI_GENERATION_ENABLED=false \
            --env AI_PROVIDER=disabled \
            --env AI_FALLBACK_PROVIDER=disabled \
            --env RELEASE_SHA="$RELEASE_SHA" \
            --entrypoint python \
            skillup-ai-worker:${{ github.sha }} -m skillup_ai_worker.health)"
          printf '%s\n' "$output"
          HEALTH_OUTPUT="$output" node -e "const health=JSON.parse(process.env.HEALTH_OUTPUT); if(health.status!=='disabled'||health.provider!=='disabled'||health.release_sha!==process.env.RELEASE_SHA) process.exit(1)"

      - name: Smoke commercial API against migrated PostgreSQL
        run: pnpm --filter @skillup/api smoke:commercial

      - name: Smoke Premium reporting against migrated PostgreSQL
        run: pnpm --filter @skillup/api smoke:premium-reporting

      - name: Smoke gameplay resume against migrated PostgreSQL
        run: node tools/smoke-gameplay-resume.mjs

      - name: Smoke API routes against migrated PostgreSQL
        run: node tools/smoke-api.mjs

      - name: Upload API smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-smoke-diagnostics-${{ github.sha }}
          path: artifacts/api-smoke-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Run production containers and end-to-end smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          capture_e2e_diagnostics() {
            docker inspect skillup-api-ci > artifacts/e2e-api-inspect.json 2>&1 || true
            docker inspect skillup-web-ci > artifacts/e2e-web-inspect.json 2>&1 || true
            docker logs skillup-api-ci > artifacts/e2e-api.log 2>&1 || true
            docker logs skillup-web-ci > artifacts/e2e-web.log 2>&1 || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then capture_e2e_diagnostics; fi; exit "$status"' EXIT

          docker rm -f skillup-api-ci skillup-web-ci >/dev/null 2>&1 || true
          docker run --detach --name skillup-api-ci --network host \
            --env APP_ENV=staging \
            --env API_HOST=0.0.0.0 \
            --env API_PORT=3001 \
            --env PUBLIC_APP_URL=http://127.0.0.1:3000 \
            --env DATABASE_URL="$DATABASE_URL" \
            --env SESSION_SECRET="$SESSION_SECRET" \
            --env EMAIL_PROVIDER=disabled \
            --env RELEASE_SHA="$RELEASE_SHA" \
            skillup-api:${{ github.sha }}

          api_ready=false
          for attempt in $(seq 1 40); do
            if node -e "fetch('http://127.0.0.1:3001/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              api_ready=true
              break
            fi
            sleep 1
          done
          test "$api_ready" = true

          docker run --detach --name skillup-web-ci --network host \
            --env PORT=3000 \
            --env HOSTNAME=0.0.0.0 \
            --env PUBLIC_APP_URL=http://127.0.0.1:3000 \
            --env API_BASE_URL=http://127.0.0.1:3001 \
            --env RELEASE_SHA="$RELEASE_SHA" \
            skillup-web:${{ github.sha }}

          web_ready=false
          for attempt in $(seq 1 40); do
            if node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              web_ready=true
              break
            fi
            sleep 1
          done
          test "$web_ready" = true

          SKILLUP_WEB_URL=http://127.0.0.1:3000 \
          SKILLUP_API_URL=http://127.0.0.1:3001 \
          SKILLUP_EXPECTED_RELEASE_SHA="$RELEASE_SHA" \
          pnpm smoke:live 2>&1 | tee artifacts/e2e-smoke.log
          trap - EXIT

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-diagnostics-${{ github.sha }}
          path: artifacts/e2e-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Write release evidence
        shell: bash
        run: |
          set -euo pipefail
          export SKILLUP_API_IMAGE_ID="$(docker image inspect skillup-api:${{ github.sha }} --format '{{.Id}}')"
          export SKILLUP_WEB_IMAGE_ID="$(docker image inspect skillup-web:${{ github.sha }} --format '{{.Id}}')"
          export SKILLUP_AI_WORKER_IMAGE_ID="$(docker image inspect skillup-ai-worker:${{ github.sha }} --format '{{.Id}}')"
          export SKILLUP_API_OCI_REVISION="$(docker image inspect skillup-api:${{ github.sha }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          export SKILLUP_WEB_OCI_REVISION="$(docker image inspect skillup-web:${{ github.sha }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          export SKILLUP_AI_WORKER_OCI_REVISION="$(docker image inspect skillup-ai-worker:${{ github.sha }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          pnpm release:evidence
          cat artifacts/release-evidence.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop local infrastructure
        if: always()
        shell: bash
        run: |
          docker rm -f skillup-api-ci skillup-web-ci >/dev/null 2>&1 || true
          docker compose -f infra/compose.yaml down -v
