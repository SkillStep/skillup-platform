name: Quality CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Apply gameplay formatting patch
    if: github.event.pull_request.user.login == 'waseem99'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout owner branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: fix/54-server-authoritative-resume
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Apply and commit formatting patch
        shell: bash
        run: |
          set -euo pipefail
          node tools/apply-gameplay-resume-format.mjs
          if git diff --quiet -- apps/api/src/gameplay.ts; then
            echo "Gameplay formatting patch is already applied."
            exit 0
          fi
          git config user.name "SkillUp CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/gameplay.ts
          git commit -m "style: format authoritative gameplay resume"
          git push origin HEAD:fix/54-server-authoritative-resume
