name: Quality CI

on:
  pull_request:
  push:
    branches:
      - feat/launch-commercial-content-ops

permissions:
  contents: write

concurrency:
  group: launch-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout launch branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/launch-commercial-content-ops
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Apply reviewed semantic fixes and exact formatting
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile

          cat > /tmp/patch_launch.py <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          admin = Path("apps/api/src/admin.ts")
          admin_text = admin.read_text()
          admin_text = admin_text.replace('import { randomUUID } from "node:crypto";\n\n', '', 1)
          support_start = admin_text.index('    supportLearner: async (userId) => {')
          query_start = admin_text.index('      const learner = await options.pool.query<Record<string, unknown>>(', support_start)
          query_end = admin_text.index('      const row = learner.rows[0];', query_start)
          replacement = '''      const learner = await options.pool.query<Record<string, unknown>>(
            `select
               u.id,
               u.status,
               p.locale,
               p.age_band as "ageBand",
               p.onboarding_status as "onboardingStatus",
               p.created_at as "createdAt",
               coalesce((
                 select sum(pl.points)
                   from points_ledger pl
                  where pl.user_id = u.id
               ), 0)::integer as "pointsEarned",
               (
                 select count(*)::integer
                   from level_play_sessions ls
                  where ls.user_id = u.id
               ) as "gameplaySessions"
             from users u
             join learner_profiles p on p.user_id = u.id
             where u.id = $1`,
            [userId],
          );
'''
          admin.write_text(admin_text[:query_start] + replacement + admin_text[query_end:])

          bootstrap = Path("packages/database/src/cli/admin-bootstrap.ts")
          bootstrap_text = bootstrap.read_text()
          bootstrap_text = bootstrap_text.replace(
              'import { randomUUID } from "node:crypto";',
              'import { createHash, randomUUID } from "node:crypto";',
              1,
          )
          bootstrap_text = bootstrap_text.replace(
              'const email = required("ADMIN_BOOTSTRAP_EMAIL").toLowerCase();\n',
              'const email = required("ADMIN_BOOTSTRAP_EMAIL").toLowerCase();\nconst emailDigest = createHash("sha256").update(email).digest("hex");\n',
              1,
          )
          bootstrap_text = bootstrap_text.replace(
              "jsonb_build_object('emailDigest', encode(digest($5, 'sha256'), 'hex'), 'roles', $6::jsonb)",
              "jsonb_build_object('emailDigest', $5::text, 'roles', $6::jsonb)",
              1,
          )
          bootstrap_text = bootstrap_text.replace(
              '[userId, reason, randomUUID(), releaseSha, email, JSON.stringify(roles)]',
              '[userId, reason, randomUUID(), releaseSha, emailDigest, JSON.stringify(roles)]',
              1,
          )
          bootstrap.write_text(bootstrap_text)

          console = Path("apps/web/app/[locale]/admin/operations-console.tsx")
          console_text = console.read_text()
          console_text = console_text.replace(
              'async function publishArtifact(artifactId: string) {',
              'async function publishArtifact(artifactId: string, targetType: string) {',
              1,
          )
          console_text = console_text.replace(
              'body: JSON.stringify({ targetType: artifactId, targetVersionId, reason }),',
              'body: JSON.stringify({ targetType, targetVersionId, reason }),',
              1,
          )
          console_text = console_text.replace(
              'onClick={() => void publishArtifact(artifact.id)}',
              'onClick={() => void publishArtifact(artifact.id, artifact.artifactType)}',
              1,
          )
          console.write_text(console_text)
          PY

          python3 /tmp/patch_launch.py
          pnpm format
          rm -f .github/workflows/format-launch-branch.yml
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/foundation.yml > .github/workflows/foundation.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize launch workflows and support queries"
          git push origin HEAD:feat/launch-commercial-content-ops
