name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository structure and configuration hygiene
        run: pnpm check

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Validate AI worker bootstrap
        shell: bash
        env:
          PYTHONPATH: services/ai-worker/src
          AI_PROVIDER: disabled
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m compileall -q services/ai-worker/src services/ai-worker/tests
          python -m unittest discover -s services/ai-worker/tests -v
          python -m skillup_ai_worker.health

      - name: Validate local infrastructure configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/compose.yaml config --quiet
