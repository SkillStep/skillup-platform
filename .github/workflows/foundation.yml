name: Quality CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, validate, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      APP_ENV: test
      AI_PROVIDER: disabled
      PUBLIC_APP_URL: https://skillup.example
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and application quality
        run: pnpm check

      - name: Validate local infrastructure configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/compose.yaml config --quiet
