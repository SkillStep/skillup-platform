name: Staging Email Diagnose Fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-email-diagnose
  cancel-in-progress: true

jobs:
  diagnose-and-fix:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Diagnose and repair staging email delivery
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGING_BREVO_API_KEY: ${{ secrets.STAGING_BREVO_API_KEY }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          envs: STAGING_BREVO_API_KEY
          script: |
            set -euo pipefail
            cd /opt/skillup
            test -f .env
            test -f docker-compose.staging.yml

            echo "== Email env keys (values redacted) =="
            python3 - <<'PY'
            from pathlib import Path
            keys = [
              "EMAIL_PROVIDER", "EMAIL_FROM", "SMTP_HOST", "SMTP_PORT",
              "SMTP_SECURE", "SMTP_REQUIRE_TLS", "SMTP_USERNAME", "SMTP_PASSWORD",
              "PUBLIC_SUPPORT_EMAIL",
            ]
            values = {}
            for line in Path(".env").read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if not s or s.startswith("#") or "=" not in line:
                continue
              k, v = line.split("=", 1)
              values[k.strip()] = v
            for key in keys:
              raw = values.get(key)
              if raw is None:
                print(f"{key}=<missing>")
              elif key in {"SMTP_PASSWORD", "SMTP_USERNAME"}:
                print(f"{key}=set(len={len(raw)})")
              else:
                print(f"{key}={raw}")
            PY

            echo "== Recent API auth/email errors =="
            docker compose -f docker-compose.staging.yml logs api --tail=300 2>/dev/null \
              | grep -E 'auth/email|sendSignIn|SMTP|nodemailer|EAUTH|EENVELOPE|email delivery|API request failed|dc2f884f|51ea41db|a4b46b40' \
              | tail -n 80 || true

            echo "== Probe live auth start =="
            code="$(curl --silent --show-error --output /tmp/skillup-email-probe.json --write-out '%{http_code}' \
              --header 'Origin: https://skillupshop.codistan.org' \
              --header 'Content-Type: application/json' \
              --data '{"email":"skillup+email-probe@codistan.org"}' \
              http://127.0.0.1:3020/api/v1/auth/email/start || true)"
            echo "probe_http=$code"
            python3 - <<'PY'
            import json
            from pathlib import Path
            raw = Path("/tmp/skillup-email-probe.json").read_text(encoding="utf-8")
            try:
              body = json.loads(raw)
            except Exception:
              print(raw[:500])
            else:
              print({k: body.get(k) for k in ("code", "message", "requestId", "challengeId") if k in body or True})
            PY

            echo "== Ensure Brevo SMTP settings when provider incomplete =="
            python3 - <<'PY'
            import os
            from pathlib import Path

            path = Path(".env")
            lines = path.read_text(encoding="utf-8").splitlines()
            current = {}
            for line in lines:
              s = line.strip()
              if not s or s.startswith("#") or "=" not in line:
                continue
              k, v = line.split("=", 1)
              current[k.strip()] = v

            provider = (current.get("EMAIL_PROVIDER") or "").strip().lower()
            host = (current.get("SMTP_HOST") or "").strip()
            username = (current.get("SMTP_USERNAME") or "").strip()
            password = (current.get("SMTP_PASSWORD") or "").strip()
            email_from = (current.get("EMAIL_FROM") or "").strip()
            brevo_key = (os.environ.get("STAGING_BREVO_API_KEY") or "").strip()

            updates = {}
            # If email is disabled or SMTP incomplete, enable Brevo SMTP using staging secret.
            incomplete = provider != "smtp" or not host or not username or not password or not email_from
            if incomplete:
              if not brevo_key:
                raise SystemExit("EMAIL incomplete and STAGING_BREVO_API_KEY missing")
              updates.update({
                "EMAIL_PROVIDER": "smtp",
                "SMTP_HOST": host or "smtp-relay.brevo.com",
                "SMTP_PORT": current.get("SMTP_PORT") or "587",
                "SMTP_SECURE": current.get("SMTP_SECURE") or "false",
                "SMTP_REQUIRE_TLS": current.get("SMTP_REQUIRE_TLS") or "true",
                "SMTP_USERNAME": username or email_from or "no-reply@codistan.org",
                "SMTP_PASSWORD": password or brevo_key,
                "EMAIL_FROM": email_from or "SkillUp Staging <no-reply@codistan.org>",
              })
              print("email_config=repaired_incomplete")
            else:
              # Provider already smtp: refresh password from Brevo secret if probe fails later handled below
              print("email_config=present_smtp")
              if brevo_key and password != brevo_key:
                # Keep existing password unless empty; do not overwrite a working dedicated SMTP key blindly.
                print("email_config=keeping_existing_smtp_password")

            if updates:
              written = set()
              output = []
              for line in lines:
                s = line.strip()
                if not s or s.startswith("#") or "=" not in line:
                  output.append(line)
                  continue
                key = line.split("=", 1)[0].strip()
                if key in updates:
                  if key not in written:
                    output.append(f"{key}={updates[key]}")
                    written.add(key)
                  continue
                output.append(line)
              for key, value in updates.items():
                if key not in written:
                  output.append(f"{key}={value}")
              path.write_text("\n".join(output) + "\n", encoding="utf-8")
              Path(".env").chmod(0o600)
            PY

            echo "== Recreate API with refreshed env =="
            docker compose -f docker-compose.staging.yml up -d --force-recreate --no-deps api
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:4020/v1/health >/dev/null; then
                echo "api_healthy"
                break
              fi
              sleep 2
            done
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4020/v1/health >/dev/null

            echo "== Re-probe auth start after repair =="
            code2="$(curl --silent --show-error --output /tmp/skillup-email-probe2.json --write-out '%{http_code}' \
              --header 'Origin: https://skillupshop.codistan.org' \
              --header 'Content-Type: application/json' \
              --data '{"email":"skillup+email-probe@codistan.org"}' \
              http://127.0.0.1:3020/api/v1/auth/email/start || true)"
            echo "probe2_http=$code2"
            cat /tmp/skillup-email-probe2.json
            echo

            if [ "$code2" != "200" ] && [ -n "${STAGING_BREVO_API_KEY:-}" ]; then
              echo "== SMTP still failing; try Brevo API key as SMTP_PASSWORD =="
              python3 - <<'PY'
            import os
            from pathlib import Path
            path = Path(".env")
            key = os.environ["STAGING_BREVO_API_KEY"].strip()
            lines = path.read_text(encoding="utf-8").splitlines()
            out = []
            seen = False
            for line in lines:
              if line.startswith("SMTP_PASSWORD="):
                out.append(f"SMTP_PASSWORD={key}")
                seen = True
              elif line.startswith("EMAIL_PROVIDER="):
                out.append("EMAIL_PROVIDER=smtp")
              elif line.startswith("SMTP_HOST=") and (not line.split("=",1)[1].strip()):
                out.append("SMTP_HOST=smtp-relay.brevo.com")
              else:
                out.append(line)
            if not seen:
              out.append(f"SMTP_PASSWORD={key}")
            path.write_text("\n".join(out) + "\n", encoding="utf-8")
            PY
              docker compose -f docker-compose.staging.yml up -d --force-recreate --no-deps api
              for i in $(seq 1 30); do
                if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:4020/v1/health >/dev/null; then
                  break
                fi
                sleep 2
              done
              code3="$(curl --silent --show-error --output /tmp/skillup-email-probe3.json --write-out '%{http_code}' \
                --header 'Origin: https://skillupshop.codistan.org' \
                --header 'Content-Type: application/json' \
                --data '{"email":"skillup+email-probe@codistan.org"}' \
                http://127.0.0.1:3020/api/v1/auth/email/start || true)"
              echo "probe3_http=$code3"
              cat /tmp/skillup-email-probe3.json
              echo
              docker compose -f docker-compose.staging.yml logs api --tail=80 \
                | grep -E 'auth/email|SMTP|nodemailer|EAUTH|EENVELOPE|API request failed' | tail -n 40 || true
              if [ "$code3" != "200" ]; then
                echo "::error::Email start still failing after Brevo SMTP password refresh"
                exit 1
              fi
            fi

            if [ "$code2" = "200" ] || [ "${code3:-}" = "200" ]; then
              echo "EMAIL_START_OK"
            else
              echo "::error::Email start still failing"
              docker compose -f docker-compose.staging.yml logs api --tail=100 \
                | grep -E 'auth/email|SMTP|nodemailer|EAUTH|EENVELOPE|API request failed' | tail -n 50 || true
              exit 1
            fi
