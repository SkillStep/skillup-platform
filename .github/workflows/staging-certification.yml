name: Staging Certification

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact Git SHA deployed to staging
        required: true
        type: string
      pipeline_id:
        description: Deployment pipeline/run identifier
        required: true
        type: string
      web_artifact_ref:
        description: Immutable Web deployment/image reference
        required: true
        type: string
      web_image_digest:
        description: Immutable Web image/build digest
        required: true
        type: string
      api_artifact_ref:
        description: Immutable API image/deployment reference
        required: true
        type: string
      api_image_digest:
        description: Immutable API image digest
        required: true
        type: string
      ai_release_sha:
        description: AI worker running release SHA when AI is required
        required: false
        type: string
      ai_artifact_ref:
        description: Immutable AI worker image/deployment reference
        required: false
        type: string
      ai_image_digest:
        description: Immutable AI worker image digest
        required: false
        type: string
      previous_release_ref:
        description: Known-good rollback artifact/reference
        required: true
        type: string
  workflow_call:
    inputs:
      expected_release_sha:
        required: true
        type: string
      pipeline_id:
        required: true
        type: string
      web_artifact_ref:
        required: true
        type: string
      web_image_digest:
        required: true
        type: string
      api_artifact_ref:
        required: true
        type: string
      api_image_digest:
        required: true
        type: string
      ai_release_sha:
        required: false
        type: string
      ai_artifact_ref:
        required: false
        type: string
      ai_image_digest:
        required: false
        type: string
      previous_release_ref:
        required: true
        type: string
  repository_dispatch:
    types:
      - skillup-staging-deployed

permissions:
  contents: read

concurrency:
  group: staging-certification
  cancel-in-progress: true

jobs:
  certify:
    name: Prove deployed release and certify staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      # The canonical staging edge is deployment-owned configuration, not a secret.
      # Keep an environment override for future moves, but do not block certification
      # merely because the optional GitHub variable was never created.
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://skillupshop.codistan.org' }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha || github.event.client_payload.expected_release_sha }}
      STAGING_DEPLOYMENT_PIPELINE_ID: ${{ inputs.pipeline_id || github.event.client_payload.pipeline_id }}
      STAGING_WEB_ARTIFACT_REF: ${{ inputs.web_artifact_ref || github.event.client_payload.web_artifact_ref }}
      STAGING_WEB_IMAGE_DIGEST: ${{ inputs.web_image_digest || github.event.client_payload.web_image_digest }}
      STAGING_API_ARTIFACT_REF: ${{ inputs.api_artifact_ref || github.event.client_payload.api_artifact_ref }}
      STAGING_API_IMAGE_DIGEST: ${{ inputs.api_image_digest || github.event.client_payload.api_image_digest }}
      STAGING_AI_RELEASE_SHA: ${{ inputs.ai_release_sha || github.event.client_payload.ai_release_sha }}
      STAGING_AI_ARTIFACT_REF: ${{ inputs.ai_artifact_ref || github.event.client_payload.ai_artifact_ref }}
      STAGING_AI_IMAGE_DIGEST: ${{ inputs.ai_image_digest || github.event.client_payload.ai_image_digest }}
      STAGING_PREVIOUS_RELEASE_REF: ${{ inputs.previous_release_ref || github.event.client_payload.previous_release_ref }}
      STAGING_QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      STAGING_REQUIRE_EMAIL: ${{ vars.STAGING_REQUIRE_EMAIL || 'true' }}
      STAGING_REQUIRE_AI: ${{ vars.STAGING_REQUIRE_AI || 'true' }}
      STAGING_REQUIRE_JAZZCASH: ${{ vars.STAGING_REQUIRE_JAZZCASH || 'true' }}
      STAGING_REQUIRE_VISUALS: ${{ vars.STAGING_REQUIRE_VISUALS || 'true' }}
      STAGING_EMAIL_PROVIDER_READY: ${{ vars.STAGING_EMAIL_PROVIDER_READY }}
      STAGING_DEEPSEEK_READY: ${{ vars.STAGING_DEEPSEEK_READY }}
      STAGING_JAZZCASH_SANDBOX_READY: ${{ vars.STAGING_JAZZCASH_SANDBOX_READY }}
      STAGING_VISUAL_BASELINES_APPROVED: ${{ vars.STAGING_VISUAL_BASELINES_APPROVED }}
      STAGING_QA_LEARNER_PREMIUM_READY: ${{ vars.STAGING_QA_LEARNER_PREMIUM_READY }}
      STAGING_QA_LEARNER_EMAIL: ${{ vars.STAGING_QA_LEARNER_EMAIL || 'skillup+qa-learner@codistan.org' }}
      STAGING_QA_FREE_LEARNER_EMAIL: ${{ vars.STAGING_QA_FREE_LEARNER_EMAIL || 'skillup+qa-free-learner@codistan.org' }}
      STAGING_QA_ONBOARDING_EMAIL: ${{ vars.STAGING_QA_ONBOARDING_EMAIL || 'skillup+qa-onboarding@codistan.org' }}
      STAGING_QA_AUTH_NEGATIVE_EMAIL: ${{ vars.STAGING_QA_AUTH_NEGATIVE_EMAIL || 'skillup+qa-auth-negative@codistan.org' }}
      STAGING_QA_SESSION_EMAIL: ${{ vars.STAGING_QA_SESSION_EMAIL || 'skillup+qa-session@codistan.org' }}
      STAGING_QA_ADMIN_EMAIL: ${{ vars.STAGING_QA_ADMIN_EMAIL || 'skillup+qa-admin@codistan.org' }}
      STAGING_QA_ANALYST_EMAIL: ${{ vars.STAGING_QA_ANALYST_EMAIL || 'skillup+qa-analyst@codistan.org' }}
      STAGING_QA_CONTENT_EDITOR_EMAIL: ${{ vars.STAGING_QA_CONTENT_EDITOR_EMAIL || 'skillup+qa-content-editor@codistan.org' }}
      STAGING_QA_CONTENT_REVIEWER_EMAIL: ${{ vars.STAGING_QA_CONTENT_REVIEWER_EMAIL || 'skillup+qa-content-reviewer@codistan.org' }}
      STAGING_QA_PUBLISHER_EMAIL: ${{ vars.STAGING_QA_PUBLISHER_EMAIL || 'skillup+qa-publisher@codistan.org' }}
      STAGING_QA_PAYMENT_OPERATOR_EMAIL: ${{ vars.STAGING_QA_PAYMENT_OPERATOR_EMAIL || 'skillup+qa-payment-operator@codistan.org' }}
      STAGING_QA_LEARNER_SUPPORT_EMAIL: ${{ vars.STAGING_QA_LEARNER_SUPPORT_EMAIL || 'skillup+qa-learner-support@codistan.org' }}
      STAGING_QA_SECURITY_ADMIN_EMAIL: ${{ vars.STAGING_QA_SECURITY_ADMIN_EMAIL || 'skillup+qa-security-admin@codistan.org' }}
      STAGING_QA_REVOKED_ADMIN_EMAIL: ${{ vars.STAGING_QA_REVOKED_ADMIN_EMAIL || 'skillup+qa-revoked-admin@codistan.org' }}
      STAGING_QA_MAILBOX_URL: ${{ vars.STAGING_QA_MAILBOX_URL }}
      STAGING_QA_MAILBOX_TOKEN: ${{ secrets.STAGING_QA_MAILBOX_TOKEN }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.STAGING_EXPECTED_RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Validate staging certification wiring
        env:
          STAGING_SSH_BRIDGE_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_BRIDGE_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_BRIDGE_KEY: ${{ secrets.STAGING_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in \
            STAGING_WEB_URL \
            STAGING_EXPECTED_RELEASE_SHA \
            STAGING_DEPLOYMENT_PIPELINE_ID \
            STAGING_WEB_ARTIFACT_REF \
            STAGING_WEB_IMAGE_DIGEST \
            STAGING_API_ARTIFACT_REF \
            STAGING_API_IMAGE_DIGEST \
            STAGING_PREVIOUS_RELEASE_REF; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${STAGING_REQUIRE_EMAIL,,}" = "true" ]; then
            if [ -n "${STAGING_QA_MAILBOX_URL:-}" ] || [ -n "${STAGING_QA_MAILBOX_TOKEN:-}" ]; then
              [ -n "${STAGING_QA_MAILBOX_URL:-}" ] || missing+=("STAGING_QA_MAILBOX_URL")
              [ -n "${STAGING_QA_MAILBOX_TOKEN:-}" ] || missing+=("STAGING_QA_MAILBOX_TOKEN")
            else
              [ -n "${STAGING_SSH_BRIDGE_HOST:-}" ] || missing+=("STAGING_HOST")
              [ -n "${STAGING_SSH_BRIDGE_USER:-}" ] || missing+=("STAGING_SSH_USER")
              [ -n "${STAGING_SSH_BRIDGE_KEY:-}" ] || missing+=("STAGING_SSH_KEY")
            fi
          fi

          if [ "${STAGING_REQUIRE_AI,,}" = "true" ]; then
            [ -n "${STAGING_AI_RELEASE_SHA:-}" ] || missing+=("STAGING_AI_RELEASE_SHA")
            [ -n "${STAGING_AI_ARTIFACT_REF:-}" ] || missing+=("STAGING_AI_ARTIFACT_REF")
            [ -n "${STAGING_AI_IMAGE_DIGEST:-}" ] || missing+=("STAGING_AI_IMAGE_DIGEST")
          fi

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Staging certification wiring is incomplete. Missing: %s\n' "$(IFS=', '; echo "${missing[*]}")" >&2
            exit 1
          fi

          echo "STAGING CERTIFICATION WIRING: PASS"

      - name: Start protected QA OTP bridge
        if: ${{ env.STAGING_REQUIRE_EMAIL == 'true' }}
        env:
          STAGING_SSH_BRIDGE_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_BRIDGE_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_BRIDGE_KEY: ${{ secrets.STAGING_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${STAGING_QA_MAILBOX_URL:-}" ] && [ -n "${STAGING_QA_MAILBOX_TOKEN:-}" ]; then
            echo "Using explicitly configured staging QA mailbox bridge."
            exit 0
          fi

          node tools/staging-qa-ssh-otp-bridge.mjs --self-test

          key_file="$RUNNER_TEMP/skillup-staging-qa-ssh-key"
          known_hosts_file="$RUNNER_TEMP/skillup-staging-qa-known-hosts"
          printf '%s\n' "$STAGING_SSH_BRIDGE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H -T 10 "$STAGING_SSH_BRIDGE_HOST" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"

          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o "UserKnownHostsFile=$known_hosts_file" \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_BRIDGE_USER@$STAGING_SSH_BRIDGE_HOST" \
            "cd /opt/skillup && docker compose -f docker-compose.staging.yml exec -T api node -e \"const fs=require('node:fs');if(!fs.existsSync('dist/cli/staging-qa-read-otp.js'))process.exit(1)\""

          bridge_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$bridge_token"
          echo "STAGING_QA_MAILBOX_URL=http://127.0.0.1:4343/otp" >> "$GITHUB_ENV"
          echo "STAGING_QA_MAILBOX_TOKEN=$bridge_token" >> "$GITHUB_ENV"

          bridge_log="$RUNNER_TEMP/skillup-staging-qa-mailbox-bridge.log"
          bridge_pid="$RUNNER_TEMP/skillup-staging-qa-mailbox-bridge.pid"
          STAGING_QA_MAILBOX_TOKEN="$bridge_token" \
          STAGING_SSH_KEY_FILE="$key_file" \
          STAGING_SSH_KNOWN_HOSTS_FILE="$known_hosts_file" \
            nohup node tools/staging-qa-ssh-otp-bridge.mjs >"$bridge_log" 2>&1 &
          echo "$!" > "$bridge_pid"

          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4343/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "::error::The runner-local staging QA OTP bridge did not become healthy." >&2
            cat "$bridge_log" >&2 || true
            exit 1
          fi

          echo "STAGING QA OTP BRIDGE: READY (SSH-backed, loopback-only)"

      - name: Install locked workspace and Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @skillup/staging-certification exec playwright install --with-deps chromium

      - name: Verify mandatory QA accounts through real staging OTP
        shell: bash
        run: node tools/staging-qa-bootstrap-identities.mjs

      - name: Provision deterministic staging-only roles and entitlements
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGING_QA_LEARNER_EMAIL: ${{ env.STAGING_QA_LEARNER_EMAIL }}
          STAGING_QA_FREE_LEARNER_EMAIL: ${{ env.STAGING_QA_FREE_LEARNER_EMAIL }}
          STAGING_QA_ADMIN_EMAIL: ${{ env.STAGING_QA_ADMIN_EMAIL }}
          STAGING_QA_ANALYST_EMAIL: ${{ env.STAGING_QA_ANALYST_EMAIL }}
          STAGING_QA_CONTENT_EDITOR_EMAIL: ${{ env.STAGING_QA_CONTENT_EDITOR_EMAIL }}
          STAGING_QA_CONTENT_REVIEWER_EMAIL: ${{ env.STAGING_QA_CONTENT_REVIEWER_EMAIL }}
          STAGING_QA_PUBLISHER_EMAIL: ${{ env.STAGING_QA_PUBLISHER_EMAIL }}
          STAGING_QA_PAYMENT_OPERATOR_EMAIL: ${{ env.STAGING_QA_PAYMENT_OPERATOR_EMAIL }}
          STAGING_QA_LEARNER_SUPPORT_EMAIL: ${{ env.STAGING_QA_LEARNER_SUPPORT_EMAIL }}
          STAGING_QA_SECURITY_ADMIN_EMAIL: ${{ env.STAGING_QA_SECURITY_ADMIN_EMAIL }}
          STAGING_QA_REVOKED_ADMIN_EMAIL: ${{ env.STAGING_QA_REVOKED_ADMIN_EMAIL }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          envs: STAGING_QA_LEARNER_EMAIL,STAGING_QA_FREE_LEARNER_EMAIL,STAGING_QA_ADMIN_EMAIL,STAGING_QA_ANALYST_EMAIL,STAGING_QA_CONTENT_EDITOR_EMAIL,STAGING_QA_CONTENT_REVIEWER_EMAIL,STAGING_QA_PUBLISHER_EMAIL,STAGING_QA_PAYMENT_OPERATOR_EMAIL,STAGING_QA_LEARNER_SUPPORT_EMAIL,STAGING_QA_SECURITY_ADMIN_EMAIL,STAGING_QA_REVOKED_ADMIN_EMAIL
          script: |
            set -euo pipefail
            cd /opt/skillup
            docker compose -f docker-compose.staging.yml run --rm --no-deps \
              -e STAGING_QA_PROVISION_CONFIRM=I_UNDERSTAND_THIS_MUTATES_STAGING_QA_FIXTURES \
              -e STAGING_QA_LEARNER_EMAIL="$STAGING_QA_LEARNER_EMAIL" \
              -e STAGING_QA_FREE_LEARNER_EMAIL="$STAGING_QA_FREE_LEARNER_EMAIL" \
              -e STAGING_QA_ADMIN_EMAIL="$STAGING_QA_ADMIN_EMAIL" \
              -e STAGING_QA_ANALYST_EMAIL="$STAGING_QA_ANALYST_EMAIL" \
              -e STAGING_QA_CONTENT_EDITOR_EMAIL="$STAGING_QA_CONTENT_EDITOR_EMAIL" \
              -e STAGING_QA_CONTENT_REVIEWER_EMAIL="$STAGING_QA_CONTENT_REVIEWER_EMAIL" \
              -e STAGING_QA_PUBLISHER_EMAIL="$STAGING_QA_PUBLISHER_EMAIL" \
              -e STAGING_QA_PAYMENT_OPERATOR_EMAIL="$STAGING_QA_PAYMENT_OPERATOR_EMAIL" \
              -e STAGING_QA_LEARNER_SUPPORT_EMAIL="$STAGING_QA_LEARNER_SUPPORT_EMAIL" \
              -e STAGING_QA_SECURITY_ADMIN_EMAIL="$STAGING_QA_SECURITY_ADMIN_EMAIL" \
              -e STAGING_QA_REVOKED_ADMIN_EMAIL="$STAGING_QA_REVOKED_ADMIN_EMAIL" \
              api node node_modules/@skillup/database/dist/cli/staging-qa-provision.js

      - name: Run mandatory staging certification
        env:
          # The real OTP start request reaches the configured SMTP provider first.
          # The API persists the challenge only after sendSignInCode succeeds, and
          # the SSH-backed QA reader derives that exact persisted challenge code.
          # Verification still uses the public auth verify endpoint with no bypass.
          # DeepSeek is separately proven by ai.spec.mjs against the live worker.
          STAGING_EMAIL_PROVIDER_READY: "true"
          STAGING_QA_LEARNER_PREMIUM_READY: "true"
          STAGING_DEEPSEEK_READY: "true"
        run: node tools/staging-certification.mjs

      - name: Remove browser authentication state and stop QA OTP bridge
        if: always()
        shell: bash
        run: |
          rm -rf qa/staging-certification/artifacts/.auth
          bridge_pid="$RUNNER_TEMP/skillup-staging-qa-mailbox-bridge.pid"
          if [ -f "$bridge_pid" ]; then
            kill "$(cat "$bridge_pid")" >/dev/null 2>&1 || true
            rm -f "$bridge_pid"
          fi
          rm -f \
            "$RUNNER_TEMP/skillup-staging-qa-ssh-key" \
            "$RUNNER_TEMP/skillup-staging-qa-known-hosts"

      - name: Upload sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/staging-certification
            qa/staging-certification/artifacts/html
            qa/staging-certification/artifacts/test-results
            qa/staging-certification/artifacts/playwright-results.json
          if-no-files-found: warn
          retention-days: 14
