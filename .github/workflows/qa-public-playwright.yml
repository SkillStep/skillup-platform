name: QA Canonical Public Playwright

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      STAGING_WEB_URL: https://skillupshop.codistan.org
    steps:
      - name: Checkout exact deployed main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Install locked workspace and Chromium
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @skillup/staging-certification exec playwright install --with-deps chromium
      - name: Run canonical public desktop project
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @skillup/staging-certification exec playwright test --project=public-desktop --reporter=line
          echo 'CANONICAL_PUBLIC_PLAYWRIGHT=PASS'
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-public-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/staging-certification/artifacts/test-results
            qa/staging-certification/artifacts/html
            qa/staging-certification/artifacts/playwright-results.json
          if-no-files-found: warn
          retention-days: 14
