name: Agent PR101 Finalizer

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 101 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/permanent-staging-certification

      - name: Configure git
        run: |
          git config user.name "SkillUp CI"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply final certification gating and four-digit OTP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected anchor not found in {path}')
              p.write_text(text.replace(old, new, 1))

          orchestrator = Path('tools/staging-certification.mjs')
          text = orchestrator.read_text()
          summary_end = '''const summary = {
            schemaVersion: "skillup-staging-certification-v1",
            runId,
            generatedAt: new Date().toISOString(),
            decision: "BLOCKED",
            expected: {},
            observed: {},
            areas: {},
          };
          '''
          if 'const softBlockedAreas' not in text:
              if summary_end not in text:
                  raise SystemExit('staging certification summary anchor not found')
              text = text.replace(summary_end, summary_end + '\nconst softBlockedAreas = new Set(["payments", "visual_regression"]);\n', 1)

          status_fn = '''function hasStatus(status) {
            return Object.values(summary.areas).some((area) => area.status === status);
          }
          '''
          if 'function hasHardBlock()' not in text:
              if status_fn not in text:
                  raise SystemExit('status helper anchor not found')
              text = text.replace(status_fn, status_fn + '''\nfunction hasHardBlock() {
            return Object.entries(summary.areas).some(
              ([name, area]) => area.status === "BLOCKED" && !softBlockedAreas.has(name),
            );
          }
          ''', 1)
          text = text.replace('if (bool("STAGING_REQUIRE_VISUALS", true)) {\n      setArea("visual_regression", "PASS", "Approved screenshot baselines matched.");\n    }', 'if (\n      bool("STAGING_REQUIRE_VISUALS", true) &&\n      bool("STAGING_VISUAL_BASELINES_APPROVED")\n    ) {\n      setArea("visual_regression", "PASS", "Approved screenshot baselines matched.");\n    }', 1)
          text = text.replace('if (!hasStatus("BLOCKED")) {\n  await runtimePreflight();\n}', 'if (!hasHardBlock()) {\n  await runtimePreflight();\n}', 1)
          text = text.replace('if (!hasStatus("BLOCKED") && !hasStatus("FAIL")) {\n  await browserCertification();\n}', 'if (!hasHardBlock() && !hasStatus("FAIL")) {\n  await browserCertification();\n}', 1)
          orchestrator.write_text(text)

          premium = Path('qa/staging-certification/tests/premium.spec.mjs')
          text = premium.read_text()
          import_anchor = 'import { expect, test } from "@playwright/test";\n'
          if 'const jazzCashSandboxReady' not in text:
              text = text.replace(import_anchor, import_anchor + '\nconst jazzCashSandboxReady =\n  process.env.STAGING_JAZZCASH_SANDBOX_READY?.toLowerCase() === "true";\n', 1)
          checkout_anchor = '''test("checkout creation is replay-safe and never grants access by client claim", async ({
            request,
          }) => {
          '''
          if 'provider checkout remains explicitly blocked' not in text:
              if checkout_anchor not in text:
                  raise SystemExit('premium checkout test anchor not found')
              text = text.replace(checkout_anchor, checkout_anchor + '''  test.skip(
            !jazzCashSandboxReady,
            "JazzCash sandbox is not configured; provider checkout remains explicitly blocked.",
          );
          ''', 1)
          premium.write_text(text)

          playwright = Path('qa/staging-certification/playwright.config.mjs')
          text = playwright.read_text()
          base_anchor = 'const trustedOrigin = new URL(baseURL).origin;\n'
          if 'const visualBaselinesApproved' not in text:
              text = text.replace(base_anchor, base_anchor + 'const visualBaselinesApproved =\n  process.env.STAGING_VISUAL_BASELINES_APPROVED?.toLowerCase() === "true";\n', 1)
          text = text.replace('testMatch: /visual\\.spec\\.mjs/,', 'testMatch: visualBaselinesApproved ? /visual\\.spec\\.mjs/ : /$a/,', 1)
          text = text.replace('testMatch: /visual-learner\\.spec\\.mjs/,', 'testMatch: visualBaselinesApproved ? /visual-learner\\.spec\\.mjs/ : /$a/,', 1)
          playwright.write_text(text)

          replace_once('apps/api/src/auth.ts', 'code: z.string().regex(/^\\d{6}$/),', 'code: z.string().regex(/^\\d{4}$/),', 'auth verify schema')
          replace_once('apps/api/src/auth.ts', 'return randomInt(0, 1_000_000).toString().padStart(6, "0");', 'return randomInt(0, 10_000).toString().padStart(4, "0");', 'auth code generation')

          signin = Path('apps/web/app/[locale]/sign-in/sign-in-form.tsx')
          text = signin.read_text()
          for old, new in {
              'Enter the six-digit code sent to your email address.': 'Enter the four-digit code sent to your email address.',
              'Six-digit code': 'Four-digit code',
              'pattern="[0-9]{6}"': 'pattern="[0-9]{4}"',
              'maxLength={6}': 'maxLength={4}',
              '.slice(0, 6)': '.slice(0, 4)',
              'code.length !== 6': 'code.length !== 4',
          }.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'sign-in form anchor not found: {old}')
          signin.write_text(text)

          identity = Path('qa/staging-certification/helpers/identity.mjs')
          text = identity.read_text()
          if '/^\\d{6}$/' in text:
              text = text.replace('/^\\d{6}$/', '/^\\d{4}$/')
          elif '/^\\d{4}$/' not in text:
              raise SystemExit('QA OTP parser anchor not found')
          identity.write_text(text)

          negative = Path('qa/staging-certification/tests/auth-negative.spec.mjs')
          text = negative.read_text()
          if '"000000" ? "111111" : "000000"' in text:
              text = text.replace('"000000" ? "111111" : "000000"', '"0000" ? "1111" : "0000"')
          elif '"0000" ? "1111" : "0000"' not in text:
              raise SystemExit('negative OTP fixture anchor not found')
          negative.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Validate and push source-only commit
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec biome format --write tools/staging-certification.mjs qa/staging-certification/playwright.config.mjs qa/staging-certification/tests/premium.spec.mjs qa/staging-certification/helpers/identity.mjs qa/staging-certification/tests/auth-negative.spec.mjs apps/api/src/auth.ts 'apps/web/app/[locale]/sign-in/sign-in-form.tsx'
          node --check tools/staging-certification.mjs
          node --check qa/staging-certification/playwright.config.mjs
          node --check qa/staging-certification/tests/premium.spec.mjs
          pnpm --filter @skillup/api test
          pnpm --filter @skillup/api typecheck
          pnpm --filter @skillup/web typecheck
          git add tools/staging-certification.mjs qa/staging-certification/playwright.config.mjs qa/staging-certification/tests/premium.spec.mjs qa/staging-certification/helpers/identity.mjs qa/staging-certification/tests/auth-negative.spec.mjs apps/api/src/auth.ts 'apps/web/app/[locale]/sign-in/sign-in-form.tsx'
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize staging gates and four-digit email OTP"
          git push origin HEAD:feat/permanent-staging-certification
