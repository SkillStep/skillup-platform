name: Temporary Export Staging Email Env

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export staging SMTP settings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Pull email/SMTP keys from staging host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STAGING_HOST:-}"
          test -n "${STAGING_SSH_USER:-}"
          test -n "${STAGING_SSH_KEY:-}"

          key_file="$RUNNER_TEMP/staging-email-key"
          known_hosts_file="$RUNNER_TEMP/staging-email-known-hosts"
          printf '%s\n' "$STAGING_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H -T 10 "$STAGING_HOST" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"

          mkdir -p out
          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o "UserKnownHostsFile=$known_hosts_file" \
            -o StrictHostKeyChecking=yes \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "grep -E '^(EMAIL_PROVIDER|EMAIL_FROM|SMTP_HOST|SMTP_PORT|SMTP_SECURE|SMTP_REQUIRE_TLS|SMTP_USERNAME|SMTP_PASSWORD)=' /opt/skillup/.env" \
            > out/staging-email.env

          rm -f "$key_file" "$known_hosts_file"

          # Mask sensitive values so they never appear in logs if printed accidentally.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              SMTP_PASSWORD=*|SMTP_USERNAME=*|EMAIL_FROM=*)
                echo "::add-mask::${line#*=}"
                ;;
            esac
          done < out/staging-email.env

          test -s out/staging-email.env
          grep -q '^EMAIL_PROVIDER=smtp$' out/staging-email.env \
            || grep -q '^EMAIL_PROVIDER=smtp' out/staging-email.env
          grep -q '^SMTP_HOST=.' out/staging-email.env
          grep -q '^SMTP_PASSWORD=.' out/staging-email.env
          echo "Staging email env export prepared (values not logged)."

      - name: Upload one-day private artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-email-env
          path: out/staging-email.env
          retention-days: 1
          if-no-files-found: error
