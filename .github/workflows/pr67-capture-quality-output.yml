name: PR 67 capture quality output

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr67-capture-quality-output
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/launch-commercial-content-ops'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/launch-commercial-content-ops
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Capture full quality output
        shell: bash
        run: |
          set +e
          pnpm check > .github/pr67-quality-diagnostic.raw.txt 2>&1
          status=$?
          python - <<'PY'
          from pathlib import Path
          import re

          raw_path = Path('.github/pr67-quality-diagnostic.raw.txt')
          output_path = Path('.github/pr67-quality-diagnostic.txt')
          text = raw_path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          output_path.write_text(text, encoding='utf-8')
          raw_path.unlink()
          PY
          printf '\nQUALITY_EXIT_STATUS=%s\n' "$status" >> .github/pr67-quality-diagnostic.txt
          exit 0

      - name: Commit diagnostic and remove this workflow
        shell: bash
        run: |
          test -s .github/pr67-quality-diagnostic.txt
          rm .github/workflows/pr67-capture-quality-output.yml
          git config user.name "skillup-ci-diagnostic"
          git config user.email "skillup-ci-diagnostic@users.noreply.github.com"
          git add .github/pr67-quality-diagnostic.txt .github/workflows/pr67-capture-quality-output.yml
          git commit -m "chore(ci): capture PR 67 quality failure"
          git push origin HEAD:feat/launch-commercial-content-ops
