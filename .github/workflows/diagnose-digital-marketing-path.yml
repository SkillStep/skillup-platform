name: Diagnose Digital Marketing Staging Path

on:
  push:
    branches:
      - qa/final-staging-cert-59604af

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Probe public routes repeatedly
        shell: bash
        run: |
          set -euo pipefail
          base='https://skillupshop.codistan.org'
          routes=(
            '/en/paths/digital-marketing-foundations'
            '/en/skills/digital-marketing-foundations'
            '/en/paths/freelancing-foundations'
          )
          for route in "${routes[@]}"; do
            echo "=== $route ==="
            for n in 1 2 3; do
              code=$(curl -L -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' --max-time 20 "$base$route" || true)
              echo "attempt=$n status=$code"
              grep -iE '^(content-type|cache-control|x-request-id|server):' /tmp/headers || true
              if [ "$code" != '200' ]; then
                echo 'BODY_START'
                head -c 2000 /tmp/body | sed -E 's/[[:cntrl:]]+/ /g' || true
                echo
                echo 'BODY_END'
              fi
              sleep 2
            done
          done

      - name: Inspect server-side response and recent web logs
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            echo '=== local web route ==='
            curl -L -sS -D /tmp/h -o /tmp/b -w 'status=%{http_code}\n' --max-time 20 http://127.0.0.1:3020/en/paths/digital-marketing-foundations || true
            grep -iE '^(content-type|cache-control|x-request-id):' /tmp/h || true
            echo '=== recent web logs (sanitized by app logging policy) ==='
            docker logs --tail 120 skillup-web-staging-container 2>&1 || true
            echo '=== recent api logs ==='
            docker logs --tail 120 skillup-api-staging-container 2>&1 || true
