name: Staging AI Validation

on:
  workflow_dispatch:
    inputs:
      run_live_evaluation:
        description: Run the seven live DeepSeek evaluation fixtures
        required: false
        default: true
        type: boolean
  push:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-deepseek]')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for the exact staging candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://skillupshop.codistan.org/api/health"
          for attempt in $(seq 1 90); do
            body="$(curl --silent --show-error --max-time 10 "$url" || true)"
            if HEALTH="$body" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          try {
            const health = JSON.parse(process.env.HEALTH || "{}");
            process.exit(health.status === "ok" && health.releaseSha === process.env.EXPECTED_SHA ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
            then
              echo "Exact staging candidate is externally reachable."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Staging never exposed expected release SHA $EXPECTED_SHA" >&2
          exit 1

      - name: Validate AI worker and DeepSeek on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUN_LIVE_EVALUATION: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_evaluation || contains(github.event.head_commit.message, '[verify-deepseek]') }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: EXPECTED_SHA,RUN_LIVE_EVALUATION
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/skillup
            compose="docker compose -f docker-compose.staging.yml"

            for attempt in $(seq 1 30); do
              state="$(docker inspect --format '{{.State.Status}}' skillup-ai-worker-staging-container 2>/dev/null || true)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' skillup-ai-worker-staging-container 2>/dev/null || true)"
              if [ "$state" = "running" ] && [ "$health" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            test "$state" = "running" || { echo "AI worker is not running" >&2; exit 1; }
            test "$health" = "healthy" || { echo "AI worker is not healthy" >&2; exit 1; }

            ai_health="$($compose exec -T ai-worker python -m skillup_ai_worker.health)"
            AI_HEALTH="$ai_health" EXPECTED_SHA="$EXPECTED_SHA" python3 - <<'PY'
            import json
            import os

            value = json.loads(os.environ['AI_HEALTH'])
            expected = os.environ['EXPECTED_SHA']
            assert value.get('status') == 'ready', value
            assert value.get('service') == 'skillup-ai-worker', value
            assert value.get('feature_enabled') is True, value
            assert value.get('provider') == 'deepseek', value
            assert value.get('fallback_provider') in (None, 'disabled'), value
            assert value.get('release_sha') == expected, value
            print('AI CONFIGURATION: PASS — enabled, DeepSeek, exact release identity')
            PY

            $compose exec -T ai-worker python - <<'PY'
            import os

            assert os.getenv('AI_JOB_API_URL', '').strip() == 'http://api:3001'
            assert len(os.getenv('AI_WORKER_SHARED_SECRET', '')) >= 32
            assert os.getenv('DEEPSEEK_API_BASE_URL', '').strip() == 'https://api.deepseek.com'
            assert os.getenv('DEEPSEEK_MODEL', '').strip() == 'deepseek-v4-flash'
            assert bool(os.getenv('DEEPSEEK_API_KEY', '').strip())
            print('AI SECRETS/QUEUE CONTRACT: PASS — required values present; secret values not printed')
            PY

            restart_count="$(docker inspect --format '{{.RestartCount}}' skillup-ai-worker-staging-container)"
            test "$restart_count" = "0" || { echo "AI worker restarted $restart_count time(s) after deployment" >&2; exit 1; }

            if [ "$RUN_LIVE_EVALUATION" = "true" ]; then
              echo "Running the seven approved live DeepSeek evaluation fixtures..."
              live_report="$($compose exec -T -e AI_EVALUATION_LIVE=true ai-worker python -m skillup_ai_worker.evaluate)"
              LIVE_REPORT="$live_report" python3 - <<'PY'
              import json
              import os

              report = json.loads(os.environ['LIVE_REPORT'])
              assert report.get('mode') == 'live', report
              assert report.get('status') == 'passed', report
              assert report.get('cases') == 7, report
              assert report.get('passed') == 7, report
              assert report.get('failed') == 0, report
              providers = {item.get('provider') for item in report.get('results', [])}
              assert providers == {'deepseek'}, providers
              print('LIVE DEEPSEEK EVALUATION: PASS — 7/7 fixtures')
              PY
            else
              echo "Live DeepSeek evaluation was not requested."
            fi
