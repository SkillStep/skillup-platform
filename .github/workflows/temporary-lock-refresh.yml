name: Temporary lockfile security refresh

on:
  push:
    branches:
      - feat/permanent-staging-certification
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/permanent-staging-certification

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Regenerate and verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm audit --prod --audit-level=high

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches overrides."
            exit 0
          fi
          git config user.name "skillup-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh patched transitive dependencies"
          git push origin HEAD:feat/permanent-staging-certification
