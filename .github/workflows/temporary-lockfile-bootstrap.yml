name: Temporary lockfile bootstrap

on:
  push:
    branches:
      - feat/15-executable-monorepo

permissions:
  contents: write

concurrency:
  group: temporary-lockfile-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Generate deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SkillUp Foundation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: generate executable workspace lockfile"
          git push origin HEAD:feat/15-executable-monorepo
