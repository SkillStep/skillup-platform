name: PR 67 index signature repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr67-index-signature-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/launch-commercial-content-ops'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/launch-commercial-content-ops
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Add explicit database row types and typed environment locals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('apps/api/src/auth.ts')
          auth = auth_path.read_text(encoding='utf-8')
          anchor = '''export type AuthenticatedLearner = Readonly<{
            id: string;
            email: string;
            profile: LearnerProfile;
          }>;
          '''
          addition = anchor + '''
          type LearnerRow = Readonly<{
            user_id: unknown;
            email_display: unknown;
            display_name: unknown;
            locale: unknown;
            age_band: unknown;
            avatar_key: unknown;
            learning_goal: unknown;
            onboarding_status: unknown;
          }>;

          type SessionLearnerRow = LearnerRow &
            Readonly<{
              session_id: unknown;
              expires_at: unknown;
            }>;
          '''
          if auth.count(anchor) != 1:
              raise SystemExit('AuthenticatedLearner type anchor was not found exactly once.')
          auth = auth.replace(anchor, addition, 1)

          replacements = {
              'function profileFromRow(row: Record<string, unknown>): LearnerProfile {':
                  'function profileFromRow(row: LearnerRow): LearnerProfile {',
              'function learnerFromRow(row: Record<string, unknown>): AuthenticatedLearner {':
                  'function learnerFromRow(row: LearnerRow): AuthenticatedLearner {',
              'const profile = await client.query<Record<string, unknown>>(':
                  'const profile = await client.query<LearnerRow>(',
              'const result = await options.pool.query<Record<string, unknown>>(':
                  'const result = await options.pool.query<SessionLearnerRow>(',
              'const current = await options.pool.query<Record<string, unknown>>(':
                  'const current = await options.pool.query<LearnerRow>(',
              'const updated = await options.pool.query<Record<string, unknown>>(':
                  'const updated = await options.pool.query<LearnerRow>(',
          }
          for old, new in replacements.items():
              if auth.count(old) != 1:
                  raise SystemExit(f'Expected exactly one auth occurrence: {old!r}; found {auth.count(old)}.')
              auth = auth.replace(old, new, 1)
          auth_path.write_text(auth, encoding='utf-8')

          smoke_path = Path('apps/api/src/commercial-lifecycle-smoke.ts')
          smoke = smoke_path.read_text(encoding='utf-8')
          old = '''const databaseUrl = requireDatabaseUrl();
          const database = new URL(databaseUrl);
          // CI or an explicit local opt-in must confirm that this database is disposable.
          const disposableDatabaseConfirmed =
            process.env.CI === "true" || process.env.SKILLUP_DISPOSABLE_DATABASE === "true";
          '''
          new = '''const databaseUrl = requireDatabaseUrl();
          const database = new URL(databaseUrl);
          const {
            APP_ENV: appEnvironment,
            CI: continuousIntegration,
            SKILLUP_DISPOSABLE_DATABASE: disposableDatabaseOptIn,
          } = process.env;
          // CI or an explicit local opt-in must confirm that this database is disposable.
          const disposableDatabaseConfirmed =
            continuousIntegration === "true" || disposableDatabaseOptIn === "true";
          '''
          if smoke.count(old) != 1:
              raise SystemExit(f'Expected one environment gate block; found {smoke.count(old)}.')
          smoke = smoke.replace(old, new, 1)
          old_assert = '  process.env.APP_ENV === "test" && disposableDatabaseConfirmed && loopbackDatabase,'
          new_assert = '  appEnvironment === "test" && disposableDatabaseConfirmed && loopbackDatabase,'
          if smoke.count(old_assert) != 1:
              raise SystemExit(f'Expected one APP_ENV assertion; found {smoke.count(old_assert)}.')
          smoke_path.write_text(smoke.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY

          pnpm exec biome check --write apps/api/src/auth.ts apps/api/src/commercial-lifecycle-smoke.ts
          pnpm --filter @skillup/api typecheck
          pnpm lint

      - name: Commit repair and remove diagnostics
        shell: bash
        run: |
          rm -f .github/pr67-quality-diagnostic.txt
          rm .github/workflows/pr67-repair-index-signatures.yml
          git config user.name "skillup-ci-repair"
          git config user.email "skillup-ci-repair@users.noreply.github.com"
          git add apps/api/src/auth.ts apps/api/src/commercial-lifecycle-smoke.ts .github/pr67-quality-diagnostic.txt .github/workflows/pr67-repair-index-signatures.yml
          git diff --cached --check
          git commit -m "fix(api): type authentication query rows explicitly"
          git push origin HEAD:feat/launch-commercial-content-ops
