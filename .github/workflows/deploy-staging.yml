name: Staging Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  prep:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image_base: ${{ steps.vars.outputs.image_base }}
    steps:
      - id: vars
        run: echo "image_base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web, ai-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ needs.prep.outputs.image_base }}-${{ matrix.service }}:staging
            ${{ needs.prep.outputs.image_base }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  resolve-images:
    needs: [prep, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      web_artifact_ref: ${{ steps.identity.outputs.web_artifact_ref }}
      web_image_digest: ${{ steps.identity.outputs.web_image_digest }}
      api_artifact_ref: ${{ steps.identity.outputs.api_artifact_ref }}
      api_image_digest: ${{ steps.identity.outputs.api_image_digest }}
      ai_artifact_ref: ${{ steps.identity.outputs.ai_artifact_ref }}
      ai_image_digest: ${{ steps.identity.outputs.ai_image_digest }}
      previous_release_ref: ${{ steps.previous.outputs.previous_release_ref }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image references
        id: identity
        shell: bash
        env:
          IMAGE_BASE: ${{ needs.prep.outputs.image_base }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          resolve_digest() {
            local ref="$1"
            local digest
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Could not resolve an immutable digest for $ref (received: $digest)" >&2
              exit 1
            }
            printf '%s' "$digest"
          }

          web_ref="$IMAGE_BASE-web:$IMAGE_TAG"
          api_ref="$IMAGE_BASE-api:$IMAGE_TAG"
          ai_ref="$IMAGE_BASE-ai-worker:$IMAGE_TAG"

          echo "web_artifact_ref=$web_ref" >> "$GITHUB_OUTPUT"
          echo "web_image_digest=$(resolve_digest "$web_ref")" >> "$GITHUB_OUTPUT"
          echo "api_artifact_ref=$api_ref" >> "$GITHUB_OUTPUT"
          echo "api_image_digest=$(resolve_digest "$api_ref")" >> "$GITHUB_OUTPUT"
          echo "ai_artifact_ref=$ai_ref" >> "$GITHUB_OUTPUT"
          echo "ai_image_digest=$(resolve_digest "$ai_ref")" >> "$GITHUB_OUTPUT"

      - name: Resolve previous staging release reference
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 10 https://skillupshop.codistan.org/api/health || true)"
          previous_ref="$(HEALTH_JSON="$health" node <<'NODE'
          try {
            const health = JSON.parse(process.env.HEALTH_JSON || "{}");
            const artifact = typeof health.artifactRef === "string" ? health.artifactRef.trim() : "";
            if (artifact && artifact !== "local" && artifact !== "unknown") {
              process.stdout.write(artifact);
            } else {
              const sha = typeof health.releaseSha === "string" ? health.releaseSha.trim() : "";
              process.stdout.write(sha && sha !== "local" ? `git:${sha}` : "bootstrap:no-previous-certified-release");
            }
          } catch {
            process.stdout.write("bootstrap:no-previous-certified-release");
          }
          NODE
          )"
          echo "previous_release_ref=$previous_ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [prep, build-and-push, resolve-images]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Encode compose file for single SSH transfer
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          printf 'compose_b64=' >> "$GITHUB_OUTPUT"
          base64 -w0 infra/docker/docker-compose.staging.yml >> "$GITHUB_OUTPUT"
          printf '\n' >> "$GITHUB_OUTPUT"

      - name: Deploy and certify internal Phase 1 gates on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BASE: ${{ needs.prep.outputs.image_base }}
          IMAGE_TAG: ${{ github.sha }}
          PIPELINE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          WEB_ARTIFACT_REF: ${{ needs.resolve-images.outputs.web_artifact_ref }}
          WEB_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.web_image_digest }}
          API_ARTIFACT_REF: ${{ needs.resolve-images.outputs.api_artifact_ref }}
          API_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.api_image_digest }}
          AI_ARTIFACT_REF: ${{ needs.resolve-images.outputs.ai_artifact_ref }}
          AI_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.ai_image_digest }}
          PREVIOUS_RELEASE_REF: ${{ needs.resolve-images.outputs.previous_release_ref }}
          COMPOSE_B64: ${{ steps.compose.outputs.compose_b64 }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: GH_ACTOR,GH_TOKEN,IMAGE_BASE,IMAGE_TAG,PIPELINE_ID,WEB_ARTIFACT_REF,WEB_IMAGE_DIGEST,API_ARTIFACT_REF,API_IMAGE_DIGEST,AI_ARTIFACT_REF,AI_IMAGE_DIGEST,PREVIOUS_RELEASE_REF,COMPOSE_B64
          script: |
            set -euo pipefail
            mkdir -p /opt/skillup
            printf '%s' "$COMPOSE_B64" | base64 -d > /opt/skillup/docker-compose.staging.yml.tmp
            mv /opt/skillup/docker-compose.staging.yml.tmp /opt/skillup/docker-compose.staging.yml
            cd /opt/skillup
            test -f .env || { echo "::error::/opt/skillup/.env is missing on the server" >&2; exit 1; }

            python3 - <<'PY'
            import os
            from pathlib import Path

            path = Path('.env')
            updates = {
                'APP_ENV': 'staging',
                'PUBLIC_APP_URL': 'https://skillupshop.codistan.org',
                'API_BASE_URL': 'http://api:3001',
                'RELEASE_SHA': os.environ['IMAGE_TAG'],
                'RELEASE_PIPELINE_ID': os.environ['PIPELINE_ID'],
                'ROLLBACK_ARTIFACT_REF': os.environ['PREVIOUS_RELEASE_REF'],
                'WEB_RELEASE_ARTIFACT_REF': os.environ['WEB_ARTIFACT_REF'],
                'WEB_RELEASE_IMAGE_DIGEST': os.environ['WEB_IMAGE_DIGEST'],
                'API_RELEASE_ARTIFACT_REF': os.environ['API_ARTIFACT_REF'],
                'API_RELEASE_IMAGE_DIGEST': os.environ['API_IMAGE_DIGEST'],
                'AI_RELEASE_ARTIFACT_REF': os.environ['AI_ARTIFACT_REF'],
                'AI_RELEASE_IMAGE_DIGEST': os.environ['AI_IMAGE_DIGEST'],
            }
            lines = path.read_text(encoding='utf-8').splitlines()
            output = []
            written = set()
            for line in lines:
                stripped = line.strip()
                if not stripped or stripped.startswith('#') or '=' not in line:
                    output.append(line)
                    continue
                key = line.split('=', 1)[0].strip()
                if key in updates:
                    if key not in written:
                        output.append(f'{key}={updates[key]}')
                        written.add(key)
                    continue
                output.append(line)
            for key, value in updates.items():
                if key not in written:
                    output.append(f'{key}={value}')
            path.write_text('\n'.join(output) + '\n', encoding='utf-8')
            PY
            chmod 600 .env

            docker compose -f docker-compose.staging.yml config --quiet
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d postgres
            for attempt in $(seq 1 45); do
              if [ "$(docker inspect skillup-postgres-staging-container --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')" = healthy ]; then
                break
              fi
              sleep 2
            done
            test "$(docker inspect skillup-postgres-staging-container --format '{{.State.Health.Status}}')" = healthy

            echo "Applying database migrations and deterministic launch seeds before application startup"
            docker compose -f docker-compose.staging.yml run --rm --no-deps api \
              node node_modules/@skillup/database/dist/cli/migrate.js
            docker compose -f docker-compose.staging.yml run --rm --no-deps api \
              node node_modules/@skillup/database/dist/cli/seed.js
            docker compose -f docker-compose.staging.yml run --rm --no-deps api \
              node node_modules/@skillup/database/dist/complete-launch-seed-v2.js
            docker compose -f docker-compose.staging.yml run --rm --no-deps api \
              node node_modules/@skillup/database/dist/cli/complete-launch-smoke.js
            echo "STAGING DATABASE MIGRATION + LAUNCH SEED: PASS"

            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker compose -f docker-compose.staging.yml ps

            wait_for_local_url() {
              label="$1"
              url="$2"
              for attempt in $(seq 1 45); do
                if curl --fail --silent --show-error --max-time 3 "$url" >/dev/null; then
                  echo "$label is healthy"
                  return 0
                fi
                sleep 2
              done
              echo "::error::$label did not become healthy: $url" >&2
              return 1
            }

            wait_for_local_url "API health" "http://127.0.0.1:4020/v1/health"
            wait_for_local_url "API database readiness" "http://127.0.0.1:4020/v1/ready"
            wait_for_local_url "Web health" "http://127.0.0.1:3020/api/health"

            legit_status="$(curl --silent --show-error --output /tmp/skillup-origin-legit.json --write-out '%{http_code}' --header 'Origin: https://skillupshop.codistan.org' --header 'Content-Type: application/json' --data '{"email":"not-an-email"}' http://127.0.0.1:3020/api/v1/auth/email/start)"
            test "$legit_status" = "400" || {
              echo "::error::Legitimate staging Origin expected HTTP 400 after schema validation, received $legit_status" >&2
              cat /tmp/skillup-origin-legit.json >&2 || true
              exit 1
            }

            hostile_status="$(curl --silent --show-error --output /tmp/skillup-origin-hostile.json --write-out '%{http_code}' --header 'Origin: https://attacker.invalid' --header 'Content-Type: application/json' --data '{"email":"qa-security@example.invalid"}' http://127.0.0.1:3020/api/v1/auth/email/start)"
            test "$hostile_status" = "403" || {
              echo "::error::Hostile Origin protection expected HTTP 403, received $hostile_status" >&2
              cat /tmp/skillup-origin-hostile.json >&2 || true
              exit 1
            }

            rm -f /tmp/skillup-origin-legit.json /tmp/skillup-origin-hostile.json
            docker image prune -f
            echo "INTERNAL PHASE 1 GATES: PASS"

      - name: Verify public staging edge from external runner
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EXPECTED_PIPELINE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_WEB_ARTIFACT_REF: ${{ needs.resolve-images.outputs.web_artifact_ref }}
          EXPECTED_WEB_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.web_image_digest }}
          EXPECTED_API_ARTIFACT_REF: ${{ needs.resolve-images.outputs.api_artifact_ref }}
          EXPECTED_API_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.api_image_digest }}
          EXPECTED_ROLLBACK_REF: ${{ needs.resolve-images.outputs.previous_release_ref }}
        run: |
          set -euo pipefail
          base="https://skillupshop.codistan.org"

          wait_for_public_url() {
            label="$1"
            url="$2"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 10 "$url" >/dev/null; then
                echo "$label is reachable with valid TLS"
                return 0
              fi
              sleep 5
            done
            echo "::error::$label is not externally reachable: $url" >&2
            return 1
          }

          wait_for_public_url "Public sign-in page" "$base/en/sign-in"
          wait_for_public_url "Public web health" "$base/api/health"
          wait_for_public_url "Public API health" "$base/api/v1/health"
          wait_for_public_url "Public API database readiness" "$base/api/v1/ready"

          web_health="$(curl --fail --silent --show-error --max-time 10 "$base/api/health")"
          api_health="$(curl --fail --silent --show-error --max-time 10 "$base/api/v1/health")"
          api_ready="$(curl --fail --silent --show-error --max-time 10 "$base/api/v1/ready")"

          WEB_HEALTH="$web_health" API_HEALTH="$api_health" API_READY="$api_ready" node <<'NODE'
          const web = JSON.parse(process.env.WEB_HEALTH);
          const api = JSON.parse(process.env.API_HEALTH);
          const ready = JSON.parse(process.env.API_READY);
          const expectedSha = process.env.EXPECTED_RELEASE_SHA;
          const expectedPipeline = process.env.EXPECTED_PIPELINE_ID;
          const expectedRollback = process.env.EXPECTED_ROLLBACK_REF;
          if (web.status !== "ok" || web.service !== "skillup-web") throw new Error("Public Web health contract failed.");
          if (api.status !== "ok" || api.service !== "skillup-api") throw new Error("Public API health contract failed.");
          if (ready.status !== "ok" || ready.service !== "skillup-api") throw new Error("Public database readiness contract failed.");
          if (web.releaseSha !== expectedSha || api.releaseSha !== expectedSha || ready.releaseSha !== expectedSha) throw new Error(`Public release identity mismatch. Expected ${expectedSha}.`);
          if (web.pipelineId !== expectedPipeline || api.pipelineId !== expectedPipeline || ready.pipelineId !== expectedPipeline) throw new Error(`Public deployment pipeline identity mismatch. Expected ${expectedPipeline}.`);
          if (web.artifactRef !== process.env.EXPECTED_WEB_ARTIFACT_REF || web.imageDigest !== process.env.EXPECTED_WEB_IMAGE_DIGEST) throw new Error("Public Web immutable artifact identity mismatch.");
          if (api.artifactRef !== process.env.EXPECTED_API_ARTIFACT_REF || api.imageDigest !== process.env.EXPECTED_API_IMAGE_DIGEST) throw new Error("Public API immutable artifact identity mismatch.");
          if (ready.artifactRef !== process.env.EXPECTED_API_ARTIFACT_REF || ready.imageDigest !== process.env.EXPECTED_API_IMAGE_DIGEST) throw new Error("Public API readiness artifact identity mismatch.");
          if (web.rollbackRef !== expectedRollback || api.rollbackRef !== expectedRollback || ready.rollbackRef !== expectedRollback) throw new Error("Public rollback reference mismatch.");
          NODE

          legit_status="$(curl --silent --show-error --output /tmp/public-origin-legit.json --write-out '%{http_code}' --header "Origin: $base" --header 'Content-Type: application/json' --data '{"email":"not-an-email"}' "$base/api/v1/auth/email/start")"
          test "$legit_status" = "400" || {
            echo "::error::Public legitimate Origin gate expected HTTP 400, received $legit_status" >&2
            cat /tmp/public-origin-legit.json >&2 || true
            exit 1
          }

          hostile_status="$(curl --silent --show-error --output /tmp/public-origin-hostile.json --write-out '%{http_code}' --header 'Origin: https://attacker.invalid' --header 'Content-Type: application/json' --data '{"email":"qa-security@example.invalid"}' "$base/api/v1/auth/email/start")"
          test "$hostile_status" = "403" || {
            echo "::error::Public hostile Origin gate expected HTTP 403, received $hostile_status" >&2
            cat /tmp/public-origin-hostile.json >&2 || true
            exit 1
          }

          rm -f /tmp/public-origin-legit.json /tmp/public-origin-hostile.json
          echo "PHASE 1 STAGING STABILIZATION: PASS"

      - name: Write sanitized staging deployment identity
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          PIPELINE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          WEB_ARTIFACT_REF: ${{ needs.resolve-images.outputs.web_artifact_ref }}
          WEB_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.web_image_digest }}
          API_ARTIFACT_REF: ${{ needs.resolve-images.outputs.api_artifact_ref }}
          API_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.api_image_digest }}
          AI_ARTIFACT_REF: ${{ needs.resolve-images.outputs.ai_artifact_ref }}
          AI_IMAGE_DIGEST: ${{ needs.resolve-images.outputs.ai_image_digest }}
          PREVIOUS_RELEASE_REF: ${{ needs.resolve-images.outputs.previous_release_ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node <<'NODE' > artifacts/staging-deployment-identity.json
          process.stdout.write(`${JSON.stringify({
            releaseSha: process.env.RELEASE_SHA,
            pipelineId: process.env.PIPELINE_ID,
            webArtifactRef: process.env.WEB_ARTIFACT_REF,
            webImageDigest: process.env.WEB_IMAGE_DIGEST,
            apiArtifactRef: process.env.API_ARTIFACT_REF,
            apiImageDigest: process.env.API_IMAGE_DIGEST,
            aiReleaseSha: process.env.RELEASE_SHA,
            aiArtifactRef: process.env.AI_ARTIFACT_REF,
            aiImageDigest: process.env.AI_IMAGE_DIGEST,
            previousReleaseRef: process.env.PREVIOUS_RELEASE_REF,
          }, null, 2)}\n`);
          NODE

      - name: Upload sanitized staging deployment identity
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-deployment-identity.json
          if-no-files-found: error
          retention-days: 14