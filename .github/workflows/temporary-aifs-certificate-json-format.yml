name: Temporary certificate policy JSON formatting
on:
  push:
    branches:
      - feat/aifs-certificate-policy-v1-owner-gated-20261116
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'SkillStep/skillup-platform' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          ref: feat/aifs-certificate-policy-v1-owner-gated-20261116
      - name: Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Install pinned formatter
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Format certificate policy JSON only
        run: |
          pnpm exec biome format --write docs/product/course-expansion/certificate-policy-v1.proposal.json
      - name: Commit JSON formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product/course-expansion/certificate-policy-v1.proposal.json
          if ! git diff --cached --quiet; then
            git commit -m "style(AIFS): format certificate policy JSON with pinned Biome"
            git push origin HEAD:feat/aifs-certificate-policy-v1-owner-gated-20261116
          fi
