name: Format Payment Acceptance

on:
  push:
    branches: [qa/payment-acceptance-suite]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/payment-acceptance-suite
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write apps/api/src/jazzcash-v11-acceptance-postgres.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/jazzcash-v11-acceptance-postgres.test.ts
          git commit -m "style(payments): format launch acceptance suite"
          git push origin HEAD:qa/payment-acceptance-suite
