name: Full Staging Black-Box QA

on:
  push:
    branches:
      - qa/full-staging-blackbox-20260818

permissions:
  contents: read

jobs:
  certify-live-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: staging
    env:
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL || 'https://skillupshop.codistan.org' }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_EXPECTED_RELEASE_SHA: af74324c9868414c275d31b024e2e1c835512500
      STAGING_QA_RUN_ID: blackbox-${{ github.run_id }}-${{ github.run_attempt }}
      STAGING_EMAIL_PROVIDER_READY: ${{ vars.STAGING_EMAIL_PROVIDER_READY }}
      STAGING_DEEPSEEK_READY: ${{ vars.STAGING_DEEPSEEK_READY }}
      STAGING_JAZZCASH_SANDBOX_READY: ${{ vars.STAGING_JAZZCASH_SANDBOX_READY }}
      STAGING_VISUAL_BASELINES_APPROVED: ${{ vars.STAGING_VISUAL_BASELINES_APPROVED }}
      STAGING_QA_LEARNER_PREMIUM_READY: ${{ vars.STAGING_QA_LEARNER_PREMIUM_READY }}
      STAGING_QA_LEARNER_EMAIL: ${{ vars.STAGING_QA_LEARNER_EMAIL }}
      STAGING_QA_FREE_LEARNER_EMAIL: ${{ vars.STAGING_QA_FREE_LEARNER_EMAIL }}
      STAGING_QA_ONBOARDING_EMAIL: ${{ vars.STAGING_QA_ONBOARDING_EMAIL }}
      STAGING_QA_AUTH_NEGATIVE_EMAIL: ${{ vars.STAGING_QA_AUTH_NEGATIVE_EMAIL }}
      STAGING_QA_SESSION_EMAIL: ${{ vars.STAGING_QA_SESSION_EMAIL }}
      STAGING_QA_ADMIN_EMAIL: ${{ vars.STAGING_QA_ADMIN_EMAIL }}
      STAGING_QA_ANALYST_EMAIL: ${{ vars.STAGING_QA_ANALYST_EMAIL }}
      STAGING_QA_CONTENT_EDITOR_EMAIL: ${{ vars.STAGING_QA_CONTENT_EDITOR_EMAIL }}
      STAGING_QA_CONTENT_REVIEWER_EMAIL: ${{ vars.STAGING_QA_CONTENT_REVIEWER_EMAIL }}
      STAGING_QA_PUBLISHER_EMAIL: ${{ vars.STAGING_QA_PUBLISHER_EMAIL }}
      STAGING_QA_PAYMENT_OPERATOR_EMAIL: ${{ vars.STAGING_QA_PAYMENT_OPERATOR_EMAIL }}
      STAGING_QA_LEARNER_SUPPORT_EMAIL: ${{ vars.STAGING_QA_LEARNER_SUPPORT_EMAIL }}
      STAGING_QA_SECURITY_ADMIN_EMAIL: ${{ vars.STAGING_QA_SECURITY_ADMIN_EMAIL }}
      STAGING_QA_REVOKED_ADMIN_EMAIL: ${{ vars.STAGING_QA_REVOKED_ADMIN_EMAIL }}
      STAGING_QA_MAILBOX_URL: ${{ vars.STAGING_QA_MAILBOX_URL }}
      STAGING_QA_MAILBOX_TOKEN: ${{ secrets.STAGING_QA_MAILBOX_TOKEN }}
      STAGING_EXPECTED_AI_PROVIDER: deepseek

    steps:
      - name: Checkout staging certification harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/permanent-staging-certification
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked QA workspace and Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @skillup/staging-certification exec playwright install --with-deps chromium

      - name: Initialize QA evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/live-blackbox
          cat > artifacts/live-blackbox/summary.md <<'EOF'
          # SkillUp live staging black-box QA

          | Area | Result | Detail |
          | --- | --- | --- |
          EOF
          : > artifacts/live-blackbox/failures.txt
          : > artifacts/live-blackbox/blocks.txt

      - name: Probe public edge, TLS, health, release and Origin controls
        shell: bash
        run: |
          set -uo pipefail
          BASE="${STAGING_WEB_URL%/}"
          pass() { printf '| %s | PASS | %s |\n' "$1" "$2" >> artifacts/live-blackbox/summary.md; }
          fail() { printf '| %s | FAIL | %s |\n' "$1" "$2" >> artifacts/live-blackbox/summary.md; printf '%s: %s\n' "$1" "$2" >> artifacts/live-blackbox/failures.txt; }
          block() { printf '| %s | BLOCKED | %s |\n' "$1" "$2" >> artifacts/live-blackbox/summary.md; printf '%s: %s\n' "$1" "$2" >> artifacts/live-blackbox/blocks.txt; }

          code=$(curl --fail-with-body -L -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 "$BASE/en" 2>/tmp/home.err || true)
          if [ "$code" = "200" ]; then pass "public_web" "HTTPS /en returned 200"; else fail "public_web" "HTTPS /en returned $code"; fi

          headers=$(curl -sS -D - -o /dev/null --max-time 20 "$BASE/api/v1/health" || true)
          if printf '%s' "$headers" | grep -qi '^strict-transport-security:'; then pass "tls_hsts" "HSTS present on public API edge"; else fail "tls_hsts" "HSTS missing on public API edge"; fi
          if printf '%s' "$headers" | grep -qi '^x-content-type-options: *nosniff'; then pass "security_headers" "nosniff present"; else fail "security_headers" "nosniff missing"; fi

          curl -sS --max-time 20 "$BASE/api/health" -o /tmp/web-health.json || true
          curl -sS --max-time 20 "$BASE/api/v1/health" -o /tmp/api-health.json || true
          curl -sS --max-time 20 "$BASE/api/v1/ready" -o /tmp/api-ready.json || true
          curl -sS --max-time 20 "$BASE/api/v1/version" -o /tmp/api-version.json || true

          node <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/live-blackbox/summary.md';
          const failures = 'artifacts/live-blackbox/failures.txt';
          function read(file){ try { return JSON.parse(fs.readFileSync(file,'utf8')); } catch { return null; } }
          function row(area,result,detail){ fs.appendFileSync(path, `| ${area} | ${result} | ${String(detail).replaceAll('|','\\|')} |\n`); if(result==='FAIL') fs.appendFileSync(failures, `${area}: ${detail}\n`); }
          const web=read('/tmp/web-health.json'); const api=read('/tmp/api-health.json'); const ready=read('/tmp/api-ready.json'); const version=read('/tmp/api-version.json');
          row('web_health', web?.status==='ok' && web?.service==='skillup-web' ? 'PASS':'FAIL', web ? `status=${web.status}, service=${web.service}, release=${web.releaseSha||'missing'}`:'invalid JSON');
          row('api_health', api?.status==='ok' && api?.service==='skillup-api' ? 'PASS':'FAIL', api ? `status=${api.status}, service=${api.service}, release=${api.releaseSha||'missing'}`:'invalid JSON');
          row('database_readiness', ready?.status==='ok' && ready?.service==='skillup-api' ? 'PASS':'FAIL', ready ? `status=${ready.status}, release=${ready.releaseSha||'missing'}`:'invalid JSON');
          const expected=process.env.STAGING_EXPECTED_RELEASE_SHA;
          row('release_identity', version?.releaseSha===expected ? 'PASS':'FAIL', version ? `running=${version.releaseSha||'missing'}, expected=${expected}`:'invalid JSON');
          const immutable = Boolean(web?.pipelineId && web?.artifactRef && web?.imageDigest && version?.pipelineId && version?.artifactRef && version?.imageDigest);
          row('immutable_release_metadata', immutable ? 'PASS':'FAIL', immutable ? 'pipeline/artifact/image digest metadata exposed by Web and API' : 'one or more pipeline/artifact/image digest fields are missing');
          NODE

          legit=$(curl -sS -o /tmp/legit.json -w '%{http_code}' --max-time 20 -H "Origin: $BASE" -H 'Content-Type: application/json' --data '{"email":"not-an-email"}' "$BASE/api/v1/auth/email/start" || true)
          if [ "$legit" = "400" ]; then pass "trusted_origin" "trusted Origin reached schema validation (400)"; else fail "trusted_origin" "expected 400, received $legit"; fi

          hostile=$(curl -sS -o /tmp/hostile.json -w '%{http_code}' --max-time 20 -H 'Origin: https://attacker.invalid' -H 'Content-Type: application/json' --data '{"email":"qa-security@example.invalid"}' "$BASE/api/v1/auth/email/start" || true)
          if [ "$hostile" = "403" ]; then pass "hostile_origin" "untrusted Origin rejected (403)"; else fail "hostile_origin" "expected 403, received $hostile"; fi

          if [ "${STAGING_EMAIL_PROVIDER_READY,,}" != "true" ]; then
            unavailable=$(curl -sS -o /tmp/email-unavailable.json -w '%{http_code}' --max-time 20 -H "Origin: $BASE" -H 'Content-Type: application/json' --data '{"email":"blackbox-probe@example.invalid"}' "$BASE/api/v1/auth/email/start" || true)
            if [ "$unavailable" = "503" ]; then pass "email_unavailable_contract" "disabled/unavailable email returns controlled 503"; else fail "email_unavailable_contract" "expected controlled 503 while provider is unavailable, received $unavailable"; fi
          else
            pass "email_unavailable_contract" "SMTP marked ready; disabled-provider probe intentionally skipped"
          fi

      - name: Public browser, discovery, PWA and safe-private-route suite
        id: public_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @skillup/staging-certification exec playwright test \
            tests/public.spec.mjs \
            --project=public-desktop \
            --reporter=line 2>&1 | tee artifacts/live-blackbox/public-playwright.log

      - name: Record public browser suite result
        shell: bash
        run: |
          if [ '${{ steps.public_suite.outcome }}' = 'success' ]; then
            echo '| public_browser_suite | PASS | launch catalog, reviewed paths, health metadata, private-route behavior |' >> artifacts/live-blackbox/summary.md
          else
            echo '| public_browser_suite | FAIL | one or more public Playwright assertions failed; see public-playwright.log |' >> artifacts/live-blackbox/summary.md
            echo 'public_browser_suite: Playwright failure' >> artifacts/live-blackbox/failures.txt
          fi

      - name: Public PWA/navigation/no-page-error suite
        id: runtime_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @skillup/staging-certification exec playwright test \
            tests/runtime-ui.spec.mjs \
            --project=public-desktop \
            --grep-invert 'release metadata' \
            --reporter=line 2>&1 | tee artifacts/live-blackbox/runtime-playwright.log

      - name: Record runtime UI result
        shell: bash
        run: |
          if [ '${{ steps.runtime_suite.outcome }}' = 'success' ]; then
            echo '| pwa_navigation_runtime | PASS | manifest/offline/navigation/refresh/no-page-error checks passed |' >> artifacts/live-blackbox/summary.md
          else
            echo '| pwa_navigation_runtime | FAIL | PWA/navigation/runtime Playwright failure |' >> artifacts/live-blackbox/summary.md
            echo 'pwa_navigation_runtime: Playwright failure' >> artifacts/live-blackbox/failures.txt
          fi

      - name: Public accessibility suite
        id: accessibility_public
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @skillup/staging-certification exec playwright test \
            tests/accessibility-public.spec.mjs \
            --project=public-desktop \
            --reporter=line 2>&1 | tee artifacts/live-blackbox/accessibility-public.log

      - name: Record public accessibility result
        shell: bash
        run: |
          if [ '${{ steps.accessibility_public.outcome }}' = 'success' ]; then
            echo '| public_accessibility | PASS | automated public accessibility assertions passed |' >> artifacts/live-blackbox/summary.md
          else
            echo '| public_accessibility | FAIL | one or more public accessibility assertions failed |' >> artifacts/live-blackbox/summary.md
            echo 'public_accessibility: Playwright failure' >> artifacts/live-blackbox/failures.txt
          fi

      - name: Anonymous/auth validation boundaries
        id: auth_public
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @skillup/staging-certification exec playwright test \
            tests/auth-negative.spec.mjs \
            --project=public-desktop \
            --grep 'invalid email is rejected|anonymous callers cannot access' \
            --reporter=line 2>&1 | tee artifacts/live-blackbox/auth-public.log

      - name: Record anonymous/auth boundary result
        shell: bash
        run: |
          if [ '${{ steps.auth_public.outcome }}' = 'success' ]; then
            echo '| anonymous_auth_boundaries | PASS | invalid email and anonymous private API boundaries passed |' >> artifacts/live-blackbox/summary.md
          else
            echo '| anonymous_auth_boundaries | FAIL | auth validation/anonymous authorization failure |' >> artifacts/live-blackbox/summary.md
            echo 'anonymous_auth_boundaries: Playwright failure' >> artifacts/live-blackbox/failures.txt
          fi

      - name: Determine authenticated certification readiness
        id: auth_ready
        shell: bash
        run: |
          set -euo pipefail
          required=(
            STAGING_QA_LEARNER_EMAIL STAGING_QA_FREE_LEARNER_EMAIL STAGING_QA_ONBOARDING_EMAIL
            STAGING_QA_AUTH_NEGATIVE_EMAIL STAGING_QA_SESSION_EMAIL STAGING_QA_ADMIN_EMAIL
            STAGING_QA_ANALYST_EMAIL STAGING_QA_CONTENT_EDITOR_EMAIL STAGING_QA_CONTENT_REVIEWER_EMAIL
            STAGING_QA_PUBLISHER_EMAIL STAGING_QA_PAYMENT_OPERATOR_EMAIL STAGING_QA_LEARNER_SUPPORT_EMAIL
            STAGING_QA_SECURITY_ADMIN_EMAIL STAGING_QA_REVOKED_ADMIN_EMAIL
            STAGING_QA_MAILBOX_URL STAGING_QA_MAILBOX_TOKEN
          )
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing=$((missing+1)); fi
          done
          if [ "${STAGING_EMAIL_PROVIDER_READY,,}" = "true" ] && [ "${STAGING_QA_LEARNER_PREMIUM_READY,,}" = "true" ] && [ "$missing" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo '| authenticated_fixture_readiness | PASS | SMTP, protected mailbox, QA identities and Premium learner fixture are configured |' >> artifacts/live-blackbox/summary.md
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '| authenticated_fixture_readiness | BLOCKED | SMTP/protected mailbox/QA identity/Premium fixture configuration is incomplete |' >> artifacts/live-blackbox/summary.md
            echo 'authenticated_fixture_readiness: external staging QA fixture configuration incomplete' >> artifacts/live-blackbox/blocks.txt
          fi
          if [ "${STAGING_DEEPSEEK_READY,,}" = "true" ]; then echo 'ai=true' >> "$GITHUB_OUTPUT"; else echo 'ai=false' >> "$GITHUB_OUTPUT"; fi

      - name: Full authenticated functional suite excluding visual, live AI and JazzCash checkout
        if: steps.auth_ready.outputs.ready == 'true'
        id: authenticated_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @skillup/staging-certification exec playwright test \
            --grep-invert '@visual|DeepSeek request reaches human review|checkout creation is replay-safe and never grants access by client claim' \
            --reporter=line 2>&1 | tee artifacts/live-blackbox/authenticated-functional.log

      - name: Record authenticated suite result
        if: steps.auth_ready.outputs.ready == 'true'
        shell: bash
        run: |
          if [ '${{ steps.authenticated_suite.outcome }}' = 'success' ]; then
            echo '| authenticated_functional | PASS | OTP/session/onboarding/free+Premium learner/gameplay/progress/account/Admin/RBAC/security/responsive suites passed |' >> artifacts/live-blackbox/summary.md
          else
            echo '| authenticated_functional | FAIL | authenticated functional suite has one or more failures |' >> artifacts/live-blackbox/summary.md
            echo 'authenticated_functional: Playwright failure' >> artifacts/live-blackbox/failures.txt
          fi

      - name: Live DeepSeek Admin lifecycle
        if: steps.auth_ready.outputs.ready == 'true' && steps.auth_ready.outputs.ai == 'true'
        id: ai_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @skillup/staging-certification exec playwright test \
            tests/ai.spec.mjs \
            --project=admin-desktop \
            --reporter=line 2>&1 | tee artifacts/live-blackbox/ai-live.log

      - name: Record AI suite result
        shell: bash
        run: |
          if [ '${{ steps.auth_ready.outputs.ready }}' != 'true' ]; then
            echo '| live_ai | BLOCKED | authenticated Admin fixture unavailable |' >> artifacts/live-blackbox/summary.md
            echo 'live_ai: authenticated Admin fixture unavailable' >> artifacts/live-blackbox/blocks.txt
          elif [ '${{ steps.auth_ready.outputs.ai }}' != 'true' ]; then
            echo '| live_ai | BLOCKED | DeepSeek readiness is not configured |' >> artifacts/live-blackbox/summary.md
            echo 'live_ai: DeepSeek readiness not configured' >> artifacts/live-blackbox/blocks.txt
          elif [ '${{ steps.ai_suite.outcome }}' = 'success' ]; then
            echo '| live_ai | PASS | DeepSeek request -> review -> publish -> rollback lifecycle passed |' >> artifacts/live-blackbox/summary.md
          else
            echo '| live_ai | FAIL | live DeepSeek Admin lifecycle failed |' >> artifacts/live-blackbox/summary.md
            echo 'live_ai: Playwright failure' >> artifacts/live-blackbox/failures.txt
          fi

      - name: Record external provider/human gates
        shell: bash
        run: |
          if [ "${STAGING_JAZZCASH_SANDBOX_READY,,}" = "true" ]; then
            echo '| jazzcash_sandbox | PASS | sandbox readiness flag is configured; provider-specific lifecycle still requires the permanent payment suite |' >> artifacts/live-blackbox/summary.md
          else
            echo '| jazzcash_sandbox | BLOCKED | PAYMENT SANDBOX NOT CONFIGURED |' >> artifacts/live-blackbox/summary.md
            echo 'jazzcash_sandbox: PAYMENT SANDBOX NOT CONFIGURED' >> artifacts/live-blackbox/blocks.txt
          fi
          if [ "${STAGING_VISUAL_BASELINES_APPROVED,,}" = "true" ]; then
            echo '| visual_regression | PASS | approved-baseline readiness flag is configured |' >> artifacts/live-blackbox/summary.md
          else
            echo '| visual_regression | BLOCKED | human-approved screenshot baselines are not configured |' >> artifacts/live-blackbox/summary.md
            echo 'visual_regression: human baseline approval required' >> artifacts/live-blackbox/blocks.txt
          fi

      - name: Print staging QA decision
        if: always()
        shell: bash
        run: |
          echo
          cat artifacts/live-blackbox/summary.md
          echo
          if [ -s artifacts/live-blackbox/failures.txt ]; then
            echo 'DECISION=FAILED'
            echo '--- failures ---'
            cat artifacts/live-blackbox/failures.txt
          elif [ -s artifacts/live-blackbox/blocks.txt ]; then
            echo 'DECISION=FUNCTIONAL-PASS-WITH-BLOCKS'
            echo '--- blocks ---'
            cat artifacts/live-blackbox/blocks.txt
          else
            echo 'DECISION=READY-FOR-UAT'
          fi

      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-staging-blackbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/live-blackbox
            qa/staging-certification/artifacts/test-results
            qa/staging-certification/artifacts/playwright-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail only for real product/runtime failures
        if: always()
        shell: bash
        run: |
          if [ -s artifacts/live-blackbox/failures.txt ]; then
            exit 1
          fi
