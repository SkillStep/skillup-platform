name: AIFS scoped preview lint diagnostics
on:
  push:
    branches: [feat/skillup-five-skill-coming-soon-20261116]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint only introduced preview files
        run: |
          pnpm exec biome lint --max-diagnostics=150 \
            apps/web/lib/coming-soon-skills.ts \
            apps/web/lib/coming-soon-skills.test.ts \
            apps/web/app/'[locale]'/skills/skill-search.tsx \
            apps/web/app/'[locale]'/skills/upcoming/'[slug]'/page.tsx \
            qa/staging-certification/tests/public.spec.mjs
