name: Generate identity migration

on:
  push:
    branches:
      - feat/20-secure-identity-foundation

permissions:
  contents: write

concurrency:
  group: generate-identity-migration
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/20-secure-identity-foundation
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Generate checked-in Drizzle migration
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/drizzle
          if ! git diff --cached --quiet; then
            git commit -m "chore(database): generate identity migration"
            git push origin HEAD:feat/20-secure-identity-foundation
          fi
