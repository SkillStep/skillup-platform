name: AIFS temporary feature-branch formatter
on:
  push:
    branches: [feat/aifs-human-course-approval-20261113]

permissions:
  contents: write

concurrency:
  group: aifs-format-feature-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped AIFS implementation
        run: |
          pnpm exec biome format --write \
            apps/api/src/content-operations.ts \
            apps/api/src/course-editorial.ts \
            apps/web/app/'[locale]'/admin/course-editorial/course-editorial-console.tsx \
            apps/web/app/'[locale]'/admin/course-editorial/page.tsx \
            apps/api/src/course-editorial.test.ts \
            tools/aifs-course-editorial-smoke.mjs \
            qa/staging-certification/tests/content-editor.spec.mjs \
            qa/staging-certification/tests/content-reviewer.spec.mjs \
            qa/staging-certification/tests/publisher.spec.mjs \
            apps/web/app/'[locale]'/admin/course-drafts/course-drafts-console.tsx \
            packages/database/src/learning-schema.ts \
            packages/database/package.json
      - name: Commit formatter output only to this feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add apps/api/src/content-operations.ts apps/api/src/course-editorial.ts
            git add 'apps/web/app/[locale]/admin/course-editorial' 'apps/web/app/[locale]/admin/course-drafts/course-drafts-console.tsx'
            git add apps/api/src/course-editorial.test.ts tools/aifs-course-editorial-smoke.mjs packages/database/src/learning-schema.ts packages/database/package.json
            git add qa/staging-certification/tests/content-editor.spec.mjs qa/staging-certification/tests/content-reviewer.spec.mjs qa/staging-certification/tests/publisher.spec.mjs
            git commit -m 'style(AIFS): apply pinned Biome formatter'
            git push origin HEAD:refs/heads/feat/aifs-human-course-approval-20261113
          fi
