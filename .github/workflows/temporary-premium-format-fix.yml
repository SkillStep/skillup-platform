name: Temporary premium format fix

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-admin-reporting
          fetch-depth: 0
      - name: Format premium reporting contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/premium-reporting-contract.ts')
          text = path.read_text(encoding='utf-8')
          old = '  value: Readonly<{ preset: z.infer<typeof PremiumPresetSchema>; from?: string | undefined; to?: string | undefined }>,'
          new = '''  value: Readonly<{
            preset: z.infer<typeof PremiumPresetSchema>;
            from?: string | undefined;
            to?: string | undefined;
          }>,'''
          if old not in text:
              raise SystemExit('Expected unformatted range type was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/premium-reporting-contract.ts
          git commit -m "style(api): format premium reporting range type"
          git push origin HEAD:feat/premium-admin-reporting
