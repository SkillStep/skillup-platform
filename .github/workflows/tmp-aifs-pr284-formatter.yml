name: Temporary AIFS PR formatting

on:
  push:
    branches:
      - chore/aifs-private-assessment-bank-281-20261118

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/aifs-private-assessment-bank-281-20261118
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed AIFS security sources and preexisting landing test
        run: |
          pnpm exec biome format --write \
            tools/scan-public-assessment-key-leak.mjs \
            tools/scan-public-assessment-key-leak.test.mjs \
            tools/validate-private-assessment-bank.mjs \
            tools/validate-private-assessment-bank.test.mjs \
            apps/web/app/mainLanding/page.test.ts
      - name: Commit formatting only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tools/scan-public-assessment-key-leak.mjs \
            tools/scan-public-assessment-key-leak.test.mjs \
            tools/validate-private-assessment-bank.mjs \
            tools/validate-private-assessment-bank.test.mjs \
            apps/web/app/mainLanding/page.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(aifs): biome format security controls [format-approved]"
            git push origin HEAD:chore/aifs-private-assessment-bank-281-20261118
          fi
