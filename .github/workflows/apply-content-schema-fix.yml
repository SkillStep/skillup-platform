name: Apply content schema runtime fix

on:
  push:
    branches:
      - feat/internal-go-live-authorities

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/internal-go-live-authorities
          fetch-depth: 0

      - name: Replace unsafe refined-schema derivation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/content-operations.ts')
          source = path.read_text()
          old = '''const ContentInputSchema = z
            .object({
              kind: KindSchema,
              slug: z
                .string()
                .regex(/^[a-z0-9]+(?:-[a-z0-9]+)*$/)
                .max(120),
              locale: LocaleSchema.default("en"),
              title: z.string().trim().min(3).max(160),
              summary: z.string().trim().min(10).max(1000),
              directAnswer: z.string().trim().min(10).max(2000).nullable().optional(),
              body: z.record(z.string(), z.unknown()),
              sourceReferences: z
                .array(
                  z
                    .object({
                      title: z.string().trim().min(3).max(300),
                      publisher: z.string().trim().min(2).max(200).optional(),
                      url: z.string().url().startsWith("https://").optional(),
                      locator: z.string().trim().min(1).max(300).optional(),
                      retrievedAt: z.iso.datetime().optional(),
                    })
                    .strict(),
                )
                .max(30),
            })
            .strict()
            .superRefine((value, context) => {
              if (Buffer.byteLength(JSON.stringify(value.body), "utf8") > 100_000) {
                context.addIssue({ code: "custom", path: ["body"], message: "Content body exceeds 100 KB." });
              }
            });

          const ContentPatchSchema = ContentInputSchema.omit({ kind: true, slug: true, locale: true })
            .partial()
            .strict()
            .refine((value) => Object.keys(value).length > 0, "At least one content field is required.");
          '''
          new = '''const SourceReferenceSchema = z
            .object({
              title: z.string().trim().min(3).max(300),
              publisher: z.string().trim().min(2).max(200).optional(),
              url: z.string().url().startsWith("https://").optional(),
              locator: z.string().trim().min(1).max(300).optional(),
              retrievedAt: z.iso.datetime().optional(),
            })
            .strict();

          const ContentEditableFieldsSchema = z.object({
            title: z.string().trim().min(3).max(160),
            summary: z.string().trim().min(10).max(1000),
            directAnswer: z.string().trim().min(10).max(2000).nullable().optional(),
            body: z.record(z.string(), z.unknown()),
            sourceReferences: z.array(SourceReferenceSchema).max(30),
          });

          const ContentInputSchema = ContentEditableFieldsSchema.extend({
            kind: KindSchema,
            slug: z
              .string()
              .regex(/^[a-z0-9]+(?:-[a-z0-9]+)*$/)
              .max(120),
            locale: LocaleSchema.default("en"),
          })
            .strict()
            .superRefine((value, context) => {
              if (Buffer.byteLength(JSON.stringify(value.body), "utf8") > 100_000) {
                context.addIssue({ code: "custom", path: ["body"], message: "Content body exceeds 100 KB." });
              }
            });

          const ContentPatchSchema = ContentEditableFieldsSchema.partial()
            .strict()
            .superRefine((value, context) => {
              if (Object.keys(value).length === 0) {
                context.addIssue({
                  code: "custom",
                  message: "At least one content field is required.",
                });
              }
              if (
                value.body !== undefined &&
                Buffer.byteLength(JSON.stringify(value.body), "utf8") > 100_000
              ) {
                context.addIssue({
                  code: "custom",
                  path: ["body"],
                  message: "Content body exceeds 100 KB.",
                });
              }
            });
          '''
          if old not in source:
              raise SystemExit('Expected content schema block was not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit fix and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/apply-content-schema-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): derive content patch schema safely"
          git push origin HEAD:feat/internal-go-live-authorities
