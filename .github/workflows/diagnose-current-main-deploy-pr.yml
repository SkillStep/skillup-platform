name: Diagnose Current Main Deploy PR

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  diagnose-current-main-deploy:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: SkillStep/skillup-platform
      SHA: 9ea1922117c6dad6dd0252b6e2535e22e76bb6d8
    steps:
      - name: Inspect Staging Deploy for current main
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" >/tmp/runs.json
          RUNS_JSON="$(cat /tmp/runs.json)" node <<'NODE'
          const body=JSON.parse(process.env.RUNS_JSON); const runs=body.workflow_runs||[];
          for(const r of runs) console.log(`RUN id=${r.id} name=${JSON.stringify(r.name)} event=${r.event} status=${r.status} conclusion=${r.conclusion||'null'} attempt=${r.run_attempt}`);
          const d=runs.find(r=>r.name==='Staging Deploy'); if(!d) throw new Error('No Staging Deploy found');
          console.log(`STAGING_DEPLOY_RUN_ID=${d.id}`); console.log(`STAGING_DEPLOY_STATUS=${d.status}`); console.log(`STAGING_DEPLOY_CONCLUSION=${d.conclusion||'null'}`);
          require('fs').writeFileSync('/tmp/id',String(d.id));
          NODE
          id=$(cat /tmp/id)
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/actions/runs/$id/jobs?per_page=100" >/tmp/jobs.json
          JOBS_JSON="$(cat /tmp/jobs.json)" node <<'NODE'
          const body=JSON.parse(process.env.JOBS_JSON); for(const j of body.jobs||[]){ console.log(`JOB id=${j.id} name=${JSON.stringify(j.name)} status=${j.status} conclusion=${j.conclusion||'null'}`); for(const s of j.steps||[]) console.log(`  STEP ${s.number} ${JSON.stringify(s.name)} status=${s.status} conclusion=${s.conclusion||'null'}`); }
          NODE
