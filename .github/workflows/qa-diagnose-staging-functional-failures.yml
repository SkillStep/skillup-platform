name: QA Diagnose Functional Failures Locally

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'qa/final-staging-8f5a3db'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://skillup_local:skillup_local_only@127.0.0.1:5432/skillup
      POSTGRES_DB: skillup
      POSTGRES_USER: skillup_local
      POSTGRES_PASSWORD: skillup_local_only
      PUBLIC_APP_URL: https://skillup.example
      SESSION_SECRET: ci-only-session-secret-at-least-32-random-bytes
      EMAIL_PROVIDER: disabled
      FEATURE_AI_GENERATION_ENABLED: "false"
      AI_PROVIDER: disabled
      AI_FALLBACK_PROVIDER: disabled
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
      - name: Build exact launch database
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          docker compose -f infra/compose.yaml up -d postgres
          pnpm db:wait
          pnpm db:migrate
          pnpm db:seed
          pnpm shared:build
      - name: Prove canonical launch gameplay data
        shell: bash
        run: |
          set -euo pipefail
          docker exec skillup-local-postgres-1 psql -U skillup_local -d skillup -Atc "select l.id, lv.id, lv.state, count(cv.id) from levels l join level_versions lv on lv.level_id=l.id left join challenge_versions cv on cv.level_version_id=lv.id and cv.state='published' where l.id='3c315a1a-824a-413e-836d-69a9fc8bad1f' group by l.id,lv.id,lv.state" | tee /tmp/level.txt
          grep -q '^3c315a1a-824a-413e-836d-69a9fc8bad1f|.*|published|3$' /tmp/level.txt
          echo 'LOCAL_CANONICAL_GAMEPLAY_DATA=PASS'
      - name: Reproduce Premium reporting against real PostgreSQL
        shell: bash
        run: |
          set +e
          pnpm --filter @skillup/api smoke:premium-reporting > /tmp/premium.log 2>&1
          status=$?
          set -e
          echo "PREMIUM_SMOKE_EXIT=$status"
          if [ "$status" -ne 0 ]; then
            grep -E -B 8 -A 25 'error:|ERROR|operator does not exist|column .* does not exist|relation .* does not exist|code:|hint:|premium' /tmp/premium.log | tail -180 || tail -120 /tmp/premium.log
            exit "$status"
          fi
          tail -5 /tmp/premium.log
          echo 'LOCAL_PREMIUM_REPORTING=PASS'
      - name: Prove Admin query schema mismatches
        shell: bash
        run: |
          set -euo pipefail
          points_column="$(docker exec skillup-local-postgres-1 psql -U skillup_local -d skillup -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='points_ledger' and column_name='points'")"
          points_delta="$(docker exec skillup-local-postgres-1 psql -U skillup_local -d skillup -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='points_ledger' and column_name='points_delta'")"
          session_status="$(docker exec skillup-local-postgres-1 psql -U skillup_local -d skillup -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='level_play_sessions' and column_name='status'")"
          session_state="$(docker exec skillup-local-postgres-1 psql -U skillup_local -d skillup -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='level_play_sessions' and column_name='state'")"
          echo "points=$points_column points_delta=$points_delta session_status=$session_status session_state=$session_state"
          test "$points_column" = 0 && test "$points_delta" = 1 && test "$session_status" = 0 && test "$session_state" = 1
          echo 'ADMIN_QUERY_SCHEMA_MISMATCH_CONFIRMED=PASS'