name: Patch launch challenge diversity

on:
  push:
    branches:
      - feat/internal-go-live-authorities
    paths:
      - .github/workflows/patch-launch-challenge-diversity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feat/internal-go-live-authorities
          persist-credentials: false
          fetch-depth: 1

      - name: Replace the three-format seed block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/database/src/complete-launch-seed-v2.ts")
          source = path.read_text()
          import_line = 'import { launchChallenges } from "./complete-launch-challenges.js";\n'
          anchor = 'import { createDatabaseClient, requireDatabaseUrl } from "./index.js";\n'
          if import_line not in source:
              source = source.replace(anchor, import_line + anchor, 1)

          pattern = re.compile(r"          const challenges = \[.*?          \] as const;", re.DOTALL)
          replacement = """          const challenges = launchChallenges({
            objective,
            strong,
            weak,
            rotation: curriculum.skillSlug.length + moduleIndex * 4 + levelIndex,
          });"""
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one launch challenge block, replaced {count}.")
          path.write_text(updated)
          PY
          git rm .github/workflows/patch-launch-challenge-diversity.yml

      - name: Commit and push patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "waseem99"
          git config user.email "mwaseemkha@gmail.com"
          git add --all
          git commit -m "feat: seed all reviewed launch challenge formats"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:feat/internal-go-live-authorities
