name: Scheduled Security Readiness

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-readiness
  cancel-in-progress: true

jobs:
  security:
    name: Dependency and production contract scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject high-severity production dependency findings
        run: pnpm audit --prod --audit-level=high

      - name: Validate production readiness contract
        run: pnpm production:check

      - name: Rebuild reviewed production images
        shell: bash
        run: |
          set -euo pipefail
          docker build --file infra/docker/api.Dockerfile --tag skillup-api:security-${{ github.sha }} .
          docker build --file infra/docker/web.Dockerfile --tag skillup-web:security-${{ github.sha }} .
          test "$(docker image inspect skillup-api:security-${{ github.sha }} --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect skillup-web:security-${{ github.sha }} --format '{{.Config.User}}')" = "node"
